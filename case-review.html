<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案件评查系统 - AI智能分析</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { font-family: 'Noto Sans SC', sans-serif; }
        :root { --bg-dark: #0f172a; }
        body { background: var(--bg-dark); }
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px); border: 1px solid #334155; }
        .btn-primary { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(59, 130, 246, 0.4); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="min-h-screen text-white">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">案件评查系统</h1>
            <p class="text-slate-400">AI智能案件分析与评查报告生成</p>
        </header>

        <div class="glass rounded-3xl p-6">
            <!-- 步骤1: 上传案件附件 -->
            <div class="mb-6">
                <div class="flex items-center gap-3 mb-4">
                    <span class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold">1</span>
                    <h2 class="text-xl font-semibold">上传案件附件</h2>
                </div>
                <button type="button" onclick="document.getElementById('fileInput').click()" class="block w-full p-6 bg-slate-800 border-2 border-dashed border-slate-700 rounded-xl text-center cursor-pointer hover:border-blue-500">
                    <svg class="w-12 h-12 mx-auto mb-3 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                    <p class="text-lg mb-1">点击选择案件文件</p>
                    <p class="text-sm text-slate-500">支持 TXT、Word、Excel、图片(OCR)、PDF</p>
                </button>
                <input type="file" id="fileInput" multiple onchange="handleFiles()" style="display: none;">
                <div id="fileList" class="mt-3 space-y-2"></div>
            </div>

            <!-- 步骤2: 补充案件描述 -->
            <div class="mb-6">
                <div class="flex items-center gap-3 mb-4">
                    <span class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center font-bold">2</span>
                    <h2 class="text-xl font-semibold">补充案件描述（可选）</h2>
                </div>
                <textarea id="caseContent" class="w-full h-40 bg-slate-200 border border-slate-400 rounded-xl p-3 text-black placeholder-gray-500" placeholder="��输入案件内容...
例：原告张三诉被告李四民间借贷纠纷一案...
诉讼请求：要求被告偿还借款10万元...
事实与理由：2023年1月1日，原告借给被告10万元..."></textarea>
            </div>

            <!-- 步骤3: AI智能分析 -->
            <div class="mb-6">
                <div class="flex items-center gap-3 mb-4">
                    <span class="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center font-bold">3</span>
                    <h2 class="text-xl font-semibold">AI智能分析</h2>
                </div>
                <button onclick="generateReport()" class="btn-primary w-full py-4 rounded-xl font-semibold text-lg flex items-center justify-center gap-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.3 3.3 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                    <span>生成评查报告</span>
                </button>

                <!-- 状态 -->
                <div id="status" class="hidden mt-4 p-4 rounded-xl bg-slate-800/50">
                    <div class="flex items-center gap-3">
                        <div class="spinner w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full"></div>
                        <span id="statusText" class="text-blue-400">正在生成评查报告...</span>
                    </div>
                </div>
            </div>

            <!-- 步骤4: 评查报告 -->
            <div id="reportSection" class="hidden">
                <div class="flex items-center gap-3 mb-4">
                    <span class="w-8 h-8 rounded-full bg-amber-600 flex items-center justify-center font-bold">4</span>
                    <h2 class="text-xl font-semibold">评查报告</h2>
                </div>
                <div class="flex gap-3 mb-4">
                    <button onclick="copyReport()" class="px-4 py-2 bg-slate-700 rounded-lg flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        复制
                    </button>
                    <button onclick="downloadReport()" class="px-4 py-2 bg-green-600 rounded-lg flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                        下载
                    </button>
                </div>
                <div id="reportContent" class="bg-slate-800/50 rounded-xl p-6 max-h-96 overflow-y-auto text-sm leading-relaxed whitespace-pre-wrap"></div>
            </div>
        </div>

        <footer class="text-center py-6 text-slate-500 text-sm">
            <p>联系QQ：7879113 | 版本 V2.3</p>
        </footer>
    </div>

    <script>
        // ============ 配置 ============
        const CONFIG = {
            API_KEY: 'sk-cp-3_mAX-zdVmNqEJY9mvVaTtaaUag9r4Dm8YnT7b5BGjywY0AFefzPEHAs0EktthEzjJWEGU-xC2-ah5hyHAPgDEWevBTwxHUcHMuVBPWsaBvztRXKrJRhhGw',
            API_URL: 'https://api.minimax.chat/v1/text/chatcompletion_v2',
            MODEL: 'MiniMax-M2.5'
        };

        // 初始化PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let uploadedFiles = [];
        let reportText = '';

        // ============ 文件上传 ============
        function handleFiles() {
            const files = Array.from(document.getElementById('fileInput').files);
            files.forEach(f => uploadedFiles.push(f));
            renderFileList();
            document.getElementById('fileInput').value = '';
        }

        function renderFileList() {
            document.getElementById('fileList').innerHTML = uploadedFiles.map((f, i) => `
                <div class="flex items-center justify-between p-2 bg-slate-800 rounded-lg">
                    <span>${f.name}</span>
                    <button onclick="uploadedFiles.splice(${i},1);renderFileList()" class="text-red-400">删除</button>
                </div>
            `).join('');
        }

        // ============ 读取文件内容 ============
        async function mergeFileContent() {
            let content = '';
            for (const file of uploadedFiles) {
                try {
                    const text = await readFileContent(file);
                    content += `\n[文件: ${file.name}]\n${text}\n`;
                } catch (e) {
                    content += `\n[文件: ${file.name}]\n读取失败: ${e.message}\n`;
                }
            }
            return content;
        }

        async function readFileContent(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (['txt', 'log', 'json', 'xml', 'csv'].includes(ext)) return await readTextFile(file);
            if (['doc', 'docx'].includes(ext)) return await readDocxFile(file);
            if (['xls', 'xlsx'].includes(ext)) return await readExcelFile(file);
            if (['pdf'].includes(ext)) return await readPdfFile(file);
            if (['png', 'jpg', 'jpeg', 'gif', 'bmp', 'webp'].includes(ext)) return await readImageFile(file);
            try { return await readTextFile(file); } catch { return '[无法识别的文件格式]' }
        }

        function readTextFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = () => reject(new Error('文件读取失败'));
                reader.readAsText(file, 'utf-8');
            });
        }

        function readDocxFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => {
                    mammoth.extractRawText({arrayBuffer: e.target.result})
                        .then(r => resolve(r.value || '[Word文件为空]'))
                        .catch(() => reject(new Error('Word解析失败')));
                };
                reader.onerror = () => reject(new Error('文件读取失败'));
                reader.readAsArrayBuffer(file);
            });
        }

        function readExcelFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const wb = XLSX.read(e.target.result, {type: 'array'});
                        let text = '';
                        wb.SheetNames.forEach(name => {
                            text += '\n--- ' + name + ' ---\n' + XLSX.utils.sheet_to_csv(wb.Sheets[name]);
                        });
                        resolve(text || '[Excel文件为空]');
                    } catch { reject(new Error('Excel解析失败')) }
                };
                reader.onerror = () => reject(new Error('文件读取失败'));
                reader.readAsArrayBuffer(file);
            });
        }

        function readPdfFile(file) {
            return new Promise(async (resolve, reject) => {
                try {
                    const arr = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({data: arr}).promise;
                    let text = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(item => item.str).join(' ') + '\n';
                    }
                    resolve(text || '[PDF无文字]');
                } catch { reject(new Error('PDF解析失败')) }
            });
        }

        function readImageFile(file) {
            return new Promise(async (resolve, reject) => {
                try {
                    const result = await Tesseract.recognize(file, 'chi_sim+eng');
                    resolve(result.data.text.trim() || '[图片无文字]');
                } catch { reject(new Error('OCR识别失败')) }
            });
        }

        // ============ 生成评查报告 ============
        async function generateReport() {
            const content = document.getElementById('caseContent').value.trim();
            
            let fileContent = '';
            if (uploadedFiles.length > 0) {
                try {
                    fileContent = await mergeFileContent();
                } catch (e) {
                    console.error('文件读取失败:', e);
                }
            }
            
            const fullContent = fileContent ? (content ? content + '\n\n=== 上传文件内容 ===\n' + fileContent : fileContent) : content;
            
            if (!fullContent) return alert('请输入案件内容或上传文件');

            document.getElementById('status').classList.remove('hidden');
            document.getElementById('reportSection').classList.add('hidden');

            try {
                const response = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': 'Bearer ' + CONFIG.API_KEY,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        model: CONFIG.MODEL,
                        messages: [
                            { role: 'system', content: '你是法律案件评查专家，擅长行政案件、民事纠纷、刑事案件的专业评查。请生成非常详细、专业的评查报告，包括：\n1. 案件基本信息（案号、当事人、案件类型）\n2. 案件事实详细梳理\n3. 法律适用分析（实体法和程序法）\n4. 证据审查（真实性、合法性、关联性）\n5. 程序合法性审查\n6. 实体审查（法律关系、责任认定）\n7. 存在的问题与风险\n8. 专业建议与解决方案\n9. 相关法律依据（列出具体法条）\n10. 评查结论与建议\n请用专业、详尽的方式撰写报告。' },
                            { role: 'user', content: '【案件内容】\n' + fullContent + '\n\n请生成详细的专业评查报告。' }
                        ]
                    })
                });
                
                if (!response.ok) throw new Error('API请求失败: ' + response.status);
                
                const data = await response.json();
                console.log('API响应:', data);
                
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const now = new Date();
                    const reportDate = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
                    reportText = data.choices[0].message.content + '\n\n--- 评查日期：' + reportDate + ' ---';
                    document.getElementById('reportContent').textContent = reportText;
                    document.getElementById('reportSection').classList.remove('hidden');
                } else {
                    throw new Error(data.base_resp?.status_msg || 'API返回格式错误');
                }
            } catch (e) {
                console.error('生成错误:', e);
                alert('生成失败: ' + e.message);
            }

            document.getElementById('status').classList.add('hidden');
        }

        function copyReport() { navigator.clipboard.writeText(reportText).then(() => alert('已复制')); }
        
        function downloadReport() {
            const now = new Date();
            const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            const timeStr = now.toTimeString().split(' ')[0].replace(/:/g, '');
            const fileName = '案件评查报告_' + dateStr + '_' + timeStr + '.txt';
            const blob = new Blob([reportText], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
        }
    </script>
</body>
</html>
