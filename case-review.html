<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案件评查系统 - AI智能分析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Noto Sans SC', sans-serif; }
        :root { --bg-dark: #0f172a; --bg-card: #1e293b; --border: #334155; }
        body { background: var(--bg-dark); }
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px); border: 1px solid var(--border); }
        .btn-primary { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(59, 130, 246, 0.4); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="min-h-screen text-white">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">案件评查系统</h1>
            <p class="text-slate-400">AI智能案件分析与评查报告生成</p>
        </header>

        <!-- 用户信息 -->
        <div id="userInfo" class="hidden mb-4 flex justify-between items-center glass px-4 py-2 rounded-xl">
            <div>
                <span class="text-slate-400">用户：</span>
                <span id="displayName" class="text-white font-bold"></span>
                <span class="text-slate-500 mx-2">|</span>
                <span class="text-amber-400">积分：</span>
                <span id="displayPoints" class="text-amber-400 font-bold"></span>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-white text-sm">退出</button>
        </div>

        <div class="glass rounded-3xl p-6">
            <!-- 登录/注册面板 -->
            <div id="authPanel">
                <!-- 登录表单 -->
                <div id="loginForm">
                    <h2 class="text-xl font-semibold mb-4 text-center">登录</h2>
                    <div class="space-y-4">
                        <input type="text" id="loginUser" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-white" placeholder="用户名">
                        <input type="password" id="loginPass" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-white" placeholder="密码">
                        <button onclick="doLogin()" class="btn-primary w-full py-3 rounded-xl font-semibold">登录</button>
                        <p class="text-center text-slate-500 text-sm">新用户？<a href="#" onclick="showRegister()" class="text-blue-400">立即注册</a>（送10积分）</p>
                    </div>
                </div>

                <!-- 注册表单 -->
                <div id="registerForm" class="hidden">
                    <h2 class="text-xl font-semibold mb-4 text-center">注册</h2>
                    <div class="space-y-4">
                        <input type="text" id="regUser" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-white" placeholder="用户名">
                        <input type="password" id="regPass" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-white" placeholder="密码（至少6位）">
                        <button onclick="doRegister()" class="btn-primary w-full py-3 rounded-xl font-semibold">注册（送10积分）</button>
                        <p class="text-center text-slate-500 text-sm">已有账号？<a href="#" onclick="showLogin()" class="text-blue-400">立即登录</a></p>
                    </div>
                </div>
            </div>

            <!-- 主功能面板 -->
            <div id="mainPanel" class="hidden">
                <!-- 案件内容输入 -->
                <div class="mb-4">
                    <h2 class="text-lg font-semibold mb-2">案件内容</h2>
                    <textarea id="caseContent" class="w-full h-48 bg-slate-700 border border-slate-600 rounded-xl p-3 text-white placeholder-slate-500" placeholder="请输入案件内容...
例：原告张三诉被告李四民间借贷纠纷..."></textarea>
                </div>

                <!-- 生成按钮 -->
                <button id="generateBtn" onclick="generateReport()" class="btn-primary w-full py-4 rounded-xl font-semibold text-lg flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.3 3.3 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                    <span id="btnText">生成评查报告</span>
                </button>

                <!-- 状态 -->
                <div id="status" class="hidden mt-4 p-4 rounded-xl bg-slate-800/50">
                    <div class="flex items-center gap-2">
                        <div class="spinner w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full"></div>
                        <span id="statusText" class="text-blue-400">正在生成...</span>
                    </div>
                </div>

                <!-- 报告结果 -->
                <div id="reportSection" class="hidden mt-4">
                    <div class="flex gap-2 mb-2">
                        <button onclick="copyReport()" class="px-4 py-2 bg-slate-700 rounded-lg">复制报告</button>
                        <button onclick="downloadReport()" class="px-4 py-2 bg-green-600 rounded-lg">下载报告</button>
                    </div>
                    <div id="reportContent" class="bg-slate-800/50 rounded-xl p-4 max-h-80 overflow-y-auto text-sm whitespace-pre-wrap"></div>
                </div>
            </div>

            <!-- 充值面板 -->
            <div id="rechargePanel" class="hidden mt-6 pt-6 border-t border-slate-700">
                <h3 class="text-lg font-semibold mb-4 text-center">积分充值</h3>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <button onclick="recharge(10)" class="p-3 bg-slate-700 rounded-xl">
                        <div class="text-xl font-bold text-amber-400">10元</div>
                        <div class="text-sm text-slate-400">10积分</div>
                    </button>
                    <button onclick="recharge(30)" class="p-3 bg-slate-700 rounded-xl">
                        <div class="text-xl font-bold text-amber-400">30元</div>
                        <div class="text-sm text-slate-400">35积分</div>
                    </button>
                    <button onclick="recharge(50)" class="p-3 bg-slate-700 rounded-xl">
                        <div class="text-xl font-bold text-amber-400">50元</div>
                        <div class="text-sm text-slate-400">60积分</div>
                    </button>
                    <button onclick="recharge(100)" class="p-3 bg-slate-700 rounded-xl">
                        <div class="text-xl font-bold text-amber-400">100元</div>
                        <div class="text-sm text-slate-400">130积分</div>
                    </button>
                </div>
                
                <h4 class="text-md font-semibold mb-2 text-center">开通会员</h4>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="buyMember('month')" class="p-3 bg-gradient-to-r from-purple-600 to-pink-600 rounded-xl">
                        <div class="font-bold">月度会员</div>
                        <div class="text-sm">28元/月</div>
                        <div class="text-xs text-slate-300">无限评查</div>
                    </button>
                    <button onclick="buyMember('year')" class="p-3 bg-gradient-to-r from-amber-600 to-orange-600 rounded-xl">
                        <div class="font-bold">年度会员</div>
                        <div class="text-sm">268元/年</div>
                        <div class="text-xs text-slate-300">无限评查</div>
                    </button>
                </div>
                
                <div class="mt-4 p-3 bg-slate-800 rounded-xl text-center">
                    <p class="text-sm text-slate-400 mb-2">扫码支付</p>
                    <p class="text-xs text-slate-500">（联系管理员微信：a2172026）</p>
                </div>
                
                <button onclick="showMain()" class="mt-4 w-full py-2 bg-slate-700 rounded-xl">返回</button>
            </div>
            
            <!-- 快速充值链接 -->
            <div id="rechargeLink" class="hidden mt-4 text-center">
                <button onclick="showRecharge()" class="text-amber-400 hover:text-amber-300">积分不足？点击充值</button>
            </div>
        </div>
    </div>

    <footer class="text-center py-6 text-slate-500 text-sm">
        <p>联系微信：a2172026 | QQ：7879113</p>
    </footer>

    <script>
        // ============ 核心配置 ============
        const CONFIG = {
            // 内置MiniMax API
            API_KEY: 'sk-cp-3_mAX-zdVmNqEJY9mvVaTtaaUag9r4Dm8YnT7b5BGjywY0AFefzPEHAs0EktthEzjJWEGU-xC2-ah5hyHAPgDEWevBTwxHUcHMuVBPWsaBvztRXKrJRhhGw',
            API_URL: 'https://api.minimax.chat/v1/text/chatcompletion_v2',
            MODEL: 'MiniMax-M2.5'
        };

        // ============ 用户系统 ============
        const DB = {
            users: JSON.parse(localStorage.getItem('case_users')) || [],
            currentUser: JSON.parse(localStorage.getItem('case_currentUser')) || null
        };

        function init() {
            // 初始化超级管理员
            const admin = DB.users.find(u => u.username === 'alex217');
            if (!admin) {
                DB.users.push({
                    id: 'admin',
                    username: 'alex217',
                    password: 'alex217',
                    points: 999999,
                    isAdmin: true,
                    isMember: true,
                    memberExpire: '2099-12-31'
                });
            } else {
                admin.points = 999999;
                admin.isAdmin = true;
                admin.isMember = true;
            }
            localStorage.setItem('case_users', JSON.stringify(DB.users));
            
            initUI();
        }

        function initUI() {
            const user = DB.currentUser;
            const authPanel = document.getElementById('authPanel');
            const mainPanel = document.getElementById('mainPanel');
            const userInfo = document.getElementById('userInfo');
            const rechargeLink = document.getElementById('rechargeLink');

            if (user) {
                authPanel.classList.add('hidden');
                mainPanel.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                document.getElementById('displayName').textContent = user.username;
                document.getElementById('displayPoints').textContent = user.points;
                
                // 更新按钮文字
                const btnText = document.getElementById('btnText');
                if (user.isAdmin || user.isMember) {
                    btnText.textContent = '生成评查报告（会员无限）';
                    rechargeLink.classList.add('hidden');
                } else {
                    btnText.textContent = '生成评查报告（消耗5积分）';
                    rechargeLink.classList.remove('hidden');
                }
            } else {
                authPanel.classList.remove('hidden');
                mainPanel.classList.add('hidden');
                userInfo.classList.add('hidden');
                rechargeLink.classList.add('hidden');
            }
        }

        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }

        function doRegister() {
            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value;
            
            if (!user || !pass) { alert('请填写用户名和密码'); return; }
            if (pass.length < 6) { alert('密码至少6位'); return; }
            if (DB.users.find(u => u.username === user)) { alert('用户名已存在'); return; }

            const newUser = {
                id: 'user_' + Date.now(),
                username: user,
                password: pass,
                points: 10,  // 新用户送10积分
                isAdmin: false,
                isMember: false
            };
            DB.users.push(newUser);
            DB.currentUser = newUser;
            localStorage.setItem('case_users', JSON.stringify(DB.users));
            localStorage.setItem('case_currentUser', JSON.stringify(DB.currentUser));
            
            alert('注册成功！赠送10积分');
            initUI();
        }

        function doLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            
            if (!user || !pass) { alert('请填写用户名和密码'); return; }
            
            const found = DB.users.find(u => u.username === user && u.password === pass);
            if (!found) { alert('用户名或密码错误'); return; }

            DB.currentUser = found;
            localStorage.setItem('case_currentUser', JSON.stringify(DB.currentUser));
            
            alert('欢迎回来，' + found.username + '！');
            initUI();
        }

        function logout() {
            DB.currentUser = null;
            localStorage.removeItem('case_currentUser');
            initUI();
        }

        function showRecharge() {
            document.getElementById('mainPanel').classList.add('hidden');
            document.getElementById('rechargePanel').classList.remove('hidden');
        }

        function showMain() {
            document.getElementById('rechargePanel').classList.add('hidden');
            document.getElementById('mainPanel').classList.remove('hidden');
        }

        function recharge(amount) {
            alert('请联系管理员微信：a2172026 充值\n金额：' + amount + '元');
        }

        function buyMember(plan) {
            const price = plan === 'month' ? 28 : 268;
            alert('请联系管理员微信：a2172026 开通会员\n金额：' + price + '元');
        }

        // ============ AI生成 ============
        let reportText = '';

        async function generateReport() {
            const user = DB.currentUser;
            if (!user) { alert('请先登录'); return; }
            
            // 检查积分
            if (!user.isAdmin && !user.isMember && user.points < 5) {
                showRecharge();
                return;
            }

            const content = document.getElementById('caseContent').value.trim();
            if (!content) { alert('请输入案件内容'); return; }

            // 扣除积分
            if (!user.isAdmin && !user.isMember) {
                user.points -= 5;
                localStorage.setItem('case_users', JSON.stringify(DB.users));
                localStorage.setItem('case_currentUser', JSON.stringify(DB.currentUser));
                document.getElementById('displayPoints').textContent = user.points;
            }

            // 显示状态
            document.getElementById('status').classList.remove('hidden');
            document.getElementById('reportSection').classList.add('hidden');

            try {
                const response = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': CONFIG.API_KEY
                    },
                    body: JSON.stringify({
                        model: CONFIG.MODEL,
                        messages: [
                            { role: 'system', content: '你是法律案件评查专家。请生成专业、详细的评查报告。' },
                            { role: 'user', content: '【案件内容】\n' + content + '\n\n请生成评查报告。' }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    reportText = data.choices[0].message.content;
                    document.getElementById('reportContent').textContent = reportText;
                    document.getElementById('reportSection').classList.remove('hidden');
                } else {
                    throw new Error(data.message || '生成失败');
                }
            } catch (e) {
                alert('生成失败: ' + e.message);
                // 恢复积分
                if (!user.isAdmin && !user.isMember) {
                    user.points += 5;
                    localStorage.setItem('case_users', JSON.stringify(DB.users));
                    localStorage.setItem('case_currentUser', JSON.stringify(DB.currentUser));
                }
            }

            document.getElementById('status').classList.add('hidden');
        }

        function copyReport() {
            navigator.clipboard.writeText(reportText).then(() => alert('已复制到剪贴板'));
        }

        function downloadReport() {
            const blob = new Blob([reportText], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '案件评查报告_' + new Date().toLocaleDateString() + '.txt';
            a.click();
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
