<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦞 我的宠物乐园</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .new-egg-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .new-egg-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .stats-bar {
            display: flex;
            gap: 15px;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            font-weight: 600;
        }
        .pet-count {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .pets-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }
        .pet-card {
            background: white;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }
        .pet-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .pet-header {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .pet-avatar {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s;
        }
        .pet-avatar:hover {
            transform: scale(1.1);
        }
        .pet-avatar.shake {
            animation: petShake 0.5s ease-in-out infinite;
        }
        @keyframes petShake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
        .pet-avatar.happy {
            animation: petBounce 0.6s ease;
        }
        @keyframes petBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .pet-info {
            flex: 1;
            margin-left: 15px;
        }
        .pet-name {
            font-size: 18px;
            font-weight: 700;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .pet-name .edit-icon {
            font-size: 12px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .pet-name .edit-icon:hover {
            opacity: 1;
        }
        .pet-type {
            font-size: 12px;
            color: #718096;
            margin-top: 2px;
        }
        .pet-level {
            background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .name-input-container {
            display: none;
            margin-top: 10px;
        }
        .name-input-container input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .name-input-container input:focus {
            border-color: #667eea;
        }
        .pet-stats {
            margin-bottom: 15px;
        }
        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .stat-icon {
            width: 24px;
            font-size: 14px;
        }
        .stat-bar-container {
            flex: 1;
            height: 12px;
            background: #edf2f7;
            border-radius: 6px;
            overflow: hidden;
            margin: 0 10px;
        }
        .stat-bar {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }
        .stat-bar.hunger { background: linear-gradient(90deg, #f56565, #e53e3e); }
        .stat-bar.happy { background: linear-gradient(90deg, #48bb78, #38a169); }
        .stat-bar.energy { background: linear-gradient(90deg, #4299e1, #3182ce); }
        .stat-value {
            width: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #4a5568;
            text-align: right;
        }
        .pet-status {
            text-align: center;
            padding: 8px;
            background: #f7fafc;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #4a5568;
        }
        .pet-status.hungry { background: #fed7d7; color: #c53030; }
        .pet-status.tired { background: #feebc8; color: #c05621; }
        .pet-status.sad { background: #e9d8fd; color: #6b46c1; }
        .pet-status.happy { background: #c6f6d5; color: #276749; }
        .pet-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .action-btn {
            padding: 10px 5px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .action-btn:hover {
            transform: translateY(-2px);
        }
        .action-btn span {
            font-size: 10px;
            margin-top: 2px;
        }
        .action-btn.feed {
            background: linear-gradient(135deg, #fbb6ce 0%, #f687b3 100%);
            box-shadow: 0 4px 10px rgba(246,135,179,0.4);
        }
        .action-btn.play {
            background: linear-gradient(135deg, #90cdf4 0%, #4299e1 100%);
            box-shadow: 0 4px 10px rgba(66,153,225,0.4);
        }
        .action-btn.sleep {
            background: linear-gradient(135deg, #c3dafe 0%, #a3bffa 100%);
            box-shadow: 0 4px 10px rgba(163,191,250,0.4);
        }
        .hatch-panel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .hatch-panel.show { display: flex; }
        .hatch-modal {
            background: white;
            border-radius: 30px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .hatch-modal h2 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 25px;
        }
        .egg-types {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .egg-type {
            background: #f7fafc;
            border: 3px solid transparent;
            border-radius: 20px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .egg-type:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102,126,234,0.3);
        }
        .egg-type .icon {
            font-size: 50px;
            display: block;
            margin-bottom: 10px;
        }
        .egg-type .name {
            font-weight: 700;
            color: #2d3748;
            font-size: 14px;
        }
        .egg-type .desc {
            font-size: 11px;
            color: #718096;
            margin-top: 5px;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            width: 35px; height: 35px;
            background: #f7fafc;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .close-btn:hover { background: #e2e8f0; }
        .empty-pets {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }
        .empty-pets .icon {
            font-size: 100px;
            margin-bottom: 20px;
        }
        .empty-pets h2 {
            margin-bottom: 15px;
        }
        .empty-pets p {
            opacity: 0.9;
            margin-bottom: 25px;
        }
        .food-panel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .food-panel.show { display: flex; }
        .food-modal {
            background: white;
            border-radius: 25px;
            padding: 25px;
            max-width: 350px;
            width: 90%;
        }
        .food-modal h3 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 20px;
        }
        .food-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .food-item {
            background: #f7fafc;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .food-item:hover {
            background: #edf2f7;
            transform: scale(1.05);
        }
        .food-item .icon {
            font-size: 35px;
            display: block;
            margin-bottom: 5px;
        }
        .food-item .name {
            font-size: 13px;
            font-weight: 600;
            color: #2d3748;
        }
        .food-item .effect {
            font-size: 11px;
            color: #718096;
        }
        .message-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 2000;
        }
        .message-toast.show { opacity: 1; }
        .pet-card.sleeping .pet-avatar {
            opacity: 0.7;
        }
        .pet-card.sleeping .pet-avatar::after {
            content: '💤';
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 我的宠物乐园</h1>
        
        <div class="header">
            <div class="stats-bar">
                <div class="pet-count">🐾 我的宠物: <span id="petCount">0</span> 只</div>
            </div>
            <button class="new-egg-btn" onclick="showHatchPanel()">🥚🥚 领养新宠物</button>
        </div>

        <div class="pets-container" id="petsContainer">
            <div class="empty-pets" id="emptyState">
                <div class="icon">🥚</div>
                <h2>还没有宠物哦~</h2>
                <p>快去领养一只属于你的小宠物吧！</p>
                <button class="new-egg-btn" onclick="showHatchPanel()">🥚🥚 领养新宠物</button>
            </div>
        </div>
    </div>

    <!-- 领养面板 -->
    <div class="hatch-panel" id="hatchPanel">
        <button class="close-btn" onclick="hideHatchPanel()">✕</button>
        <div class="hatch-modal">
            <h2>🎁 选择你想要领养的宠物</h2>
            <div class="egg-types">
                <div class="egg-type" onclick="hatchPet('crayfish')">
                    <span class="icon">🦞</span>
                    <span class="name">小龙虾</span>
                    <span class="desc">活泼好动</span>
                </div>
                <div class="egg-type" onclick="hatchPet('cat')">
                    <span class="icon">🐱</span>
                    <span class="name">小猫咪</span>
                    <span class="desc">高冷傲娇</span>
                </div>
                <div class="egg-type" onclick="hatchPet('dog')">
                    <span class="icon">🐶</span>
                    <span class="name">小狗狗</span>
                    <span class="desc">忠诚友善</span>
                </div>
                <div class="egg-type" onclick="hatchPet('rabbit')">
                    <span class="icon">🐰</span>
                    <span class="name">小兔子</span>
                    <span class="desc">温柔可爱</span>
                </div>
                <div class="egg-type" onclick="hatchPet('bird')">
                    <span class="icon">🐦</span>
                    <span class="name">小鸟</span>
                    <span class="desc">歌声甜美</span>
                </div>
                <div class="egg-type" onclick="hatchPet('panda')">
                    <span class="icon">🐼</span>
                    <span class="name">小熊猫</span>
                    <span class="desc">憨厚呆萌</span>
                </div>
                <div class="egg-type" onclick="hatchPet('penguin')">
                    <span class="icon">🐧</span>
                    <span class="name">小企鹅</span>
                    <span class="desc">呆萌可爱</span>
                </div>
                <div class="egg-type" onclick="hatchPet('fox')">
                    <span class="icon">🦊</span>
                    <span class="name">小狐狸</span>
                    <span class="desc">聪明伶俐</span>
                </div>
                <div class="egg-type" onclick="hatchPet('owl')">
                    <span class="icon">🦉</span>
                    <span class="name">小猫头鹰</span>
                    <span class="desc">睿智沉稳</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 喂食面板 -->
    <div class="food-panel" id="foodPanel">
        <div class="food-modal">
            <h3>🍽️ 选择食物</h3>
            <div class="food-grid">
                <div class="food-item" onclick="feedPet('apple')">
                    <span class="icon">🍎</span>
                    <span class="name">苹果</span>
                    <span class="effect">+15 饱食度</span>
                </div>
                <div class="food-item" onclick="feedPet('carrot')">
                    <span class="icon">🥕</span>
                    <span class="name">胡萝卜</span>
                    <span class="effect">+12 饱食度</span>
                </div>
                <div class="food-item" onclick="feedPet('fish')">
                    <span class="icon">🐟</span>
                    <span class="name">小鱼干</span>
                    <span class="effect">+20 饱食度</span>
                </div>
                <div class="food-item" onclick="feedPet('cake')">
                    <span class="icon">🍰</span>
                    <span class="name">小蛋糕</span>
                    <span class="effect">+25 饱食度</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 消息提示 -->
    <div class="message-toast" id="messageToast"></div>

    <script>
        let pets = [];
        let currentPetId = null;

        const PET_ICONS = {
            crayfish: '🦞', cat: '🐱', dog: '🐶', rabbit: '🐰',
            bird: '🐦', panda: '🐼', penguin: '🐧', fox: '🦊', owl: '🦉'
        };
        const PET_NAMES = {
            crayfish: '小龙虾', cat: '小猫咪', dog: '小狗狗', rabbit: '小兔子',
            bird: '小鸟', panda: '小熊猫', penguin: '小企鹅', fox: '小狐狸', owl: '小猫头鹰'
        };
        const PET_MESSAGES = {
            hungry: ['肚子饿了...', '想吃东西~', '好饿啊...'],
            tired: ['好困...', '想睡觉了', '打了个哈欠'],
            sad: ['不开心...', '陪我玩嘛~', '有点无聊'],
            happy: ['好开心呀！', '最喜欢你了！', '今天真快乐~'],
            full: ['吃饱啦~', '吃不下了', '好满足~'],
            playing: ['太好玩了！', '再来一次！', '哈哈~']
        };

        function loadGame() {
            const saved = localStorage.getItem('myPetGame');
            if (saved) {
                pets = JSON.parse(saved);
            }
            renderPets();
        }

        function saveGame() {
            localStorage.setItem('myPetGame', JSON.stringify(pets));
        }

        function generateId() {
            return Date.now() + Math.random().toString(36).substr(2, 9);
        }

        function showHatchPanel() {
            document.getElementById('hatchPanel').classList.add('show');
        }

        function hideHatchPanel() {
            document.getElementById('hatchPanel').classList.remove('show');
        }

        function showFoodPanel(petId) {
            currentPetId = petId;
            document.getElementById('foodPanel').classList.add('show');
        }

        function hideFoodPanel() {
            document.getElementById('foodPanel').classList.remove('show');
            currentPetId = null;
        }

        function hatchPet(type) {
            hideHatchPanel();
            const pet = {
                id: generateId(),
                type: type,
                name: PET_NAMES[type],
                level: 1,
                exp: 0,
                hunger: 80,
                happy: 80,
                energy: 100,
                isSleeping: false,
                createdAt: Date.now()
            };
            pets.push(pet);
            saveGame();
            renderPets();
            showMessage(`🎉 恭喜获得 ${PET_NAMES[type]}！`);
        }

        function feedPet(food) {
            hideFoodPanel();
            if (!currentPetId) return;
            
            const pet = pets.find(p => p.id === currentPetId);
            if (!pet) return;
            
            const foodEffects = { apple: 15, carrot: 12, fish: 20, cake: 25 };
            pet.hunger = Math.min(100, pet.hunger + (foodEffects[food] || 10));
            pet.happy = Math.min(100, pet.happy + 3);
            pet.exp += 10;
            
            checkLevelUp(pet);
            saveGame();
            renderPets();
            
            const foods = { apple: '苹果', carrot: '胡萝卜', fish: '小鱼干', cake: '小蛋糕' };
            showMessage(`${pet.name} 吃了 ${foods[food]}，+${foodEffects[food]} 饱食度`);
        }

        function playWithPet(petId) {
            const pet = pets.find(p => p.id === petId);
            if (!pet) return;
            
            if (pet.isSleeping) {
                showMessage(`${pet.name} 正在睡觉...`);
                return;
            }
            
            if (pet.energy < 20) {
                showMessage(`${pet.name} 太累了，想睡觉~`);
                return;
            }
            
            pet.energy = Math.max(0, pet.energy - 10);
            pet.happy = Math.min(100, pet.happy + 15);
            pet.hunger = Math.max(0, pet.hunger - 5);
            pet.exp += 15;
            
            checkLevelUp(pet);
            saveGame();
            renderPets();
            
            const avatar = document.querySelector(`[data-pet-id="${petId}"] .pet-avatar`);
            if (avatar) {
                avatar.classList.add('happy');
                setTimeout(() => avatar.classList.remove('happy'), 600);
            }
            
            showMessage(`${pet.name} 玩得很开心！+15 快乐度`);
        }

        function toggleSleep(petId) {
            const pet = pets.find(p => p.id === petId);
            if (!pet) return;
            
            pet.isSleeping = !pet.isSleeping;
            if (pet.isSleeping) {
                pet.energy = 100;
                showMessage(`${pet.name} 开始睡觉了... Zzz`);
            } else {
                showMessage(`${pet.name} 睡醒啦！`);
            }
            
            saveGame();
            renderPets();
        }

        function editPetName(petId) {
            const pet = pets.find(p => p.id === petId);
            if (!pet) return;
            
            const input = document.querySelector(`[data-pet-id="${petId}"] .name-input`);
            const nameDisplay = document.querySelector(`[data-pet-id="${petId}"] .pet-name`);
            
            if (input.style.display === 'none') {
                input.style.display = 'block';
                input.value = pet.name;
                input.focus();
                nameDisplay.style.display = 'none';
            } else {
                if (input.value.trim()) {
                    pet.name = input.value.trim();
                    saveGame();
                }
                input.style.display = 'none';
                nameDisplay.style.display = 'flex';
                renderPets();
            }
        }

        function deletePet(petId) {
            if (confirm('确定要放生这只宠物吗？')) {
                const pet = pets.find(p => p.id === petId);
                pets = pets.filter(p => p.id !== petId);
                saveGame();
                renderPets();
                showMessage(`${pet?.name || '宠物'} 被放生了...`);
            }
        }

        function checkLevelUp(pet) {
            const expNeeded = pet.level * 100;
            while (pet.exp >= expNeeded) {
                pet.exp -= expNeeded;
                pet.level++;
                showMessage(`🎊 ${pet.name} 升级了！现在是 ${pet.level} 级！`);
            }
        }

        function getPetStatus(pet) {
            if (pet.isSleeping) return { text: '💤 正在睡觉...', class: '' };
            if (pet.hunger < 30) return { text: '😫 ' + PET_MESSAGES.hungry[Math.floor(Math.random() * 3)], class: 'hungry' };
            if (pet.energy < 30) return { text: '😴 ' + PET_MESSAGES.tired[Math.floor(Math.random() * 3)], class: 'tired' };
            if (pet.happy < 30) return { text: '😢 ' + PET_MESSAGES.sad[Math.floor(Math.random() * 3)], class: 'sad' };
            return { text: '😊 ' + PET_MESSAGES.happy[Math.floor(Math.random() * 3)], class: 'happy' };
        }

        function renderPets() {
            document.getElementById('petCount').textContent = pets.length;
            const container = document.getElementById('petsContainer');
            
            if (pets.length === 0) {
                container.innerHTML = `
                    <div class="empty-pets">
                        <div class="icon">🥚</div>
                        <h2>还没有宠物哦~</h2>
                        <p>快去领养一只属于你的小宠物吧！</p>
                        <button class="new-egg-btn" onclick="showHatchPanel()">🥚🥚 领养新宠物</button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = pets.map(pet => {
                const status = getPetStatus(pet);
                const sleepingClass = pet.isSleeping ? 'sleeping' : '';
                return `
                    <div class="pet-card ${sleepingClass}" data-pet-id="${pet.id}">
                        <div class="pet-header">
                            <div class="pet-avatar ${pet.isSleeping ? '' : 'shake'}" onclick="playWithPet('${pet.id}')">
                                ${PET_ICONS[pet.type]}
                            </div>
                            <div class="pet-info">
                                <div class="pet-name">
                                    ${pet.name}
                                    <span class="edit-icon" onclick="editPetName('${pet.id}')">✏️</span>
                                </div>
                                <div class="pet-type">${PET_NAMES[pet.type]}</div>
                                <div class="name-input-container">
                                    <input type="text" class="name-input" maxlength="10" onkeypress="if(event.key==='Enter') editPetName('${pet.id}')">
                                </div>
                            </div>
                            <div class="pet-level">Lv.${pet.level}</div>
                        </div>
                        
                        <div class="pet-stats">
                            <div class="stat-row">
                                <span class="stat-icon">🍖</span>
                                <div class="stat-bar-container">
                                    <div class="stat-bar hunger" style="width: ${pet.hunger}%"></div>
                                </div>
                                <span class="stat-value">${pet.hunger}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-icon">😊</span>
                                <div class="stat-bar-container">
                                    <div class="stat-bar happy" style="width: ${pet.happy}%"></div>
                                </div>
                                <span class="stat-value">${pet.happy}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-icon">⚡</span>
                                <div class="stat-bar-container">
                                    <div class="stat-bar energy" style="width: ${pet.energy}%"></div>
                                </div>
                                <span class="stat-value">${pet.energy}</span>
                            </div>
                        </div>
                        
                        <div class="pet-status ${status.class}">${status.text}</div>
                        
                        <div class="pet-actions">
                            <button class="action-btn feed" onclick="showFoodPanel('${pet.id}')">
                                🍖
                                <span>喂食</span>
                            </button>
                            <button class="action-btn play" onclick="playWithPet('${pet.id}')">
                                🎮
                                <span>玩耍</span>
                            </button>
                            <button class="action-btn sleep" onclick="toggleSleep('${pet.id}')">
                                ${pet.isSleeping ? '☀️' : '😴'}
                                <span>${pet.isSleeping ? '唤醒' : '睡觉'}</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showMessage(text) {
            const toast = document.getElementById('messageToast');
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // 游戏循环 - 每30秒更新一次宠物状态
        function gameLoop() {
            let changed = false;
            pets.forEach(pet => {
                if (pet.isSleeping) {
                    // 睡觉时恢复体力
                    if (pet.energy < 100) {
                        pet.energy = Math.min(100, pet.energy + 5);
                        changed = true;
                    }
                } else {
                    // 醒着时消耗属性
                    if (pet.hunger > 0) {
                        pet.hunger = Math.max(0, pet.hunger - 1);
                        changed = true;
                    }
                    if (pet.happy > 0) {
                        pet.happy = Math.max(0, pet.happy - 0.5);
                        changed = true;
                    }
                    if (pet.energy > 0) {
                        pet.energy = Math.max(0, pet.energy - 0.3);
                        changed = true;
                    }
                }
            });
            
            if (changed) {
                saveGame();
                renderPets();
            }
        }

        // 初始化
        loadGame();
        setInterval(gameLoop, 30000); // 每30秒检查一次
    </script>
</body>
</html>
