  updateUI()
}

function saveUsers(){localStorage.setItem("petUsers",JSON.stringify(users))}
function saveCurrentUser(){localStorage.setItem("petCurrentUser",currentUser?JSON.stringify(currentUser):null)}

function loadUserData(){
  if(!currentUser)return;
  var key="petData_"+currentUser.username;
  var s=localStorage.getItem(key);
  if(s){try{pets=JSON.parse(s)}catch(e){pets=[]}}else{pets=[]}
}

function saveUserData(){
  if(!currentUser)return;
  var key="petData_"+currentUser.username;
  localStorage.setItem(key,JSON.stringify(pets))
}

function updateUI(){
  var auth=document.getElementById("authScreen");
  var main=document.getElementById("mainApp");
  if(currentUser){
    auth.style.display="none";
    main.classList.add("show");
    document.getElementById("userName").textContent=currentUser.username;
    render()
  }else{
    auth.style.display="flex";
    main.classList.remove("show")
  }
}

function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(function(){t.classList.remove("show")},2500)
}

function showError(el,msg){
  el.textContent=msg;
  el.classList.add("show");
  setTimeout(function(){el.classList.remove("show")},3000)
}

function hashPassword(p){
  var h=0;
  for(var i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h=h&h}
  return "x"+Math.abs(h).toString(36)
}

function bindAuthEvents(){
  var tabs=document.querySelectorAll(".auth-tab");
  for(var i=0;i<tabs.length;i++){
    tabs[i].onclick=function(){
      tabs.forEach(function(t){t.classList.remove("active")});
      this.classList.add("active");
      var tab=this.getAttribute("data-tab");
      document.getElementById("loginForm").classList.toggle("active",tab==="login");
      document.getElementById("registerForm").classList.toggle("active",tab==="register")
    }
  }
  document.getElementById("loginForm").onsubmit=function(e){
    e.preventDefault();
    var u=document.getElementById("loginUsername").value.trim();
    var p=document.getElementById("loginPassword").value;
    if(!u||!p){showError(document.getElementById("loginError"),"请填写完整");return}
    if(!users[u]||users[u].password!==hashPassword(p)){
      showError(document.getElementById("loginError"),"用户名或密码错误");
      return
    }
    currentUser={username:u};
    saveCurrentUser();
    loadUserData();
    updateUI();
    toast("欢迎回来，"+u+"！")
  };
  document.getElementById("registerForm").onsubmit=function(e){
    e.preventDefault();
    var u=document.getElementById("regUsername").value.trim();
    var p=document.getElementById("regPassword").value;
    var p2=document.getElementById("regPassword2").value;
    if(u.length<3||u.length>12){showError(document.getElementById("regError"),"用户名需要3-12位");return}
    if(p.length<6){showError(document.getElementById("regError"),"密码需要6位以上");return}
    if(p!==p2){showError(document.getElementById("regError"),"两次密码不一致");return}
    if(users[u]){showError(document.getElementById("regError"),"用户名已存在");return}
    users[u]={password:hashPassword(p),created:Date.now()};
    saveUsers();
    currentUser={username:u};
    pets=[];
    saveCurrentUser();
    saveUserData();
    updateUI();
    toast("注册成功，欢迎 "+u+"！");
    document.getElementById("regUsername").value="";
    document.getElementById("regPassword").value="";
    document.getElementById("regPassword2").value=""
  };
  document.getElementById("logoutBtn").onclick=function(){
    saveUserData();
    currentUser=null;
    pets=[];
    saveCurrentUser();
    updateUI();
    toast("已退出登录")
  };
  document.getElementById("adoptBtn").onclick=showAdopt;
  document.getElementById("closeAdopt").onclick=hideAdopt;
  document.getElementById("closeFeed").onclick=hideFeed;
  document.getElementById("adoptPanel").onclick=function(e){if(e.target===this)hideAdopt()};
  document.getElementById("feedPanel").onclick=function(e){if(e.target===this)hideFeed()};
  var ai=document.querySelectorAll("#adoptPanel .item");
  for(var i=0;i<ai.length;i++){
    ai[i].onclick=(function(el){return function(){hatch(el.getAttribute("data-type"))}})(ai[i])
  }
  var fi=document.querySelectorAll("#feedPanel .item");
  for(var i=0;i<fi.length;i++){
    fi[i].onclick=(function(el){return function(){feed(el.getAttribute("data-food"))}})(fi[i])
  }
}

function showAdopt(){document.getElementById("adoptPanel").classList.add("active")}
function hideAdopt(){document.getElementById("adoptPanel").classList.remove("active")}
function showFeed(id){currentFeedId=id;document.getElementById("feedPanel").classList.add("active")}
function hideFeed(){document.getElementById("feedPanel").classList.remove("active");currentFeedId=null}

function hatch(type){
  hideAdopt();
  var pet={
    id:Date.now().toString(36)+Math.random().toString(36).substr(2,5),
    type:type,
    name:N[type],
    level:1,
    exp:0,
    hunger:80,
    happy:80,
    energy:100,
    sleeping:false
  };
  pets.push(pet);
  saveUserData();
  render();
  toast("恭喜获得 "+N[type]+"！")
}

function getPet(id){
  for(var i=0;i<pets.length;i++){if(pets[i].id)return pets[i];return null}
function feed(food){
  if(!currentFeedId)return;
  var p=getPet(currentFeedId);
  if(!p){hideFeed();return}
  p.hunger=Math.min(100,p.hunger+(E[food]||10));
  p.happy=Math.min(100,p.happy+3);
  p.exp+=10;
  checkLv(p);
  saveUserData();
  render();
  hideFeed();
  toast(p.name+" 吃了食物！")
}
function play(id){
  var p=getPet(id);
  if(!p)return;
  if(p.sleeping){toast(p.name+" 在睡觉...");return}
  if(p.energy<20){toast(p.name+" 太累了！");return}
  p.energy=Math.max(0,p.energy-10);
  p.happy=Math.min(100,p.happy+15);
  p.hunger=Math.max(0,p.hunger-5);
  p.exp+=15;
  checkLv(p);
  saveUserData();
  render();
  var av=document.getElementById("av"+id);
  if(av){av.classList.add("happy");setTimeout(function(){av.classList.remove("happy")},600)}
  toast(p.name+" 玩得很开心！")
}
function sleep(id){
  var p=getPet(id);
  if(!p)return;
  p.sleeping=!p.sleeping;
  if(p.sleeping){p.energy=100;toast(p.name+" 开始睡觉... Zzz")}
  else{toast(p.name+" 睡醒啦！")}
  saveUserData();
  render()
}
function checkLv(p){
  var need=p.level*100;
  while(p.exp>=need){p.exp-=need;p.level++;toast(p.name+" 升级了！Lv."+p.level+"！")}
}
function getStatus(p){
  if(p.sleeping)return{text:"💤 睡觉中...",cls:""};
  if(p.hunger<30)return{text:"😫 "+M.hungry[Math.floor(Math.random()*3)],cls:"hungry"};
  if(p.energy<30)return{text:"😴 "+M.tired[Math.floor(Math.random()*3)],cls:"tired"};
  if(p.happy<30)return{text:"😢 "+M.sad[Math.floor(Math.random()*3)],cls:"sad"};
  return{text:"😊 "+M.happy[Math.floor(Math.random()*3)],cls:"happy"}
}
function getAvatar(t){
  var f={
    rat:'<div class="rat-face"></div><div class="rat-ear left"></div><div class="rat-ear right"></div><div class="rat-eye left"></div><div class="rat-eye right"></div><div class="rat-nose"></div>',
    ox:'<div class="ox-face"></div><div class="ox-horn left"></div><div class="ox-horn right"></div><div class="ox-eye left"></div><div class="ox-eye right"></div>',
    tiger:'<div class="tiger-face"></div><div class="tiger-stripe s1"></div><div class="tiger-stripe s2"></div><div class="tiger-stripe s3"></div><div class="tiger-stripe s4"></div><div class="tiger-eye left"></div><div class="tiger-eye right"></div>',
    rabbit:'<div class="rabbit-face"></div><div class="rabbit-ear"></div><div class="rabbit-ear right"></div><div class="rabbit-eye left"></div><div class="rabbit-eye right"></div>',
    dragon:'<div class="dragon-face"></div><div class="dragon-horn left"></div><div class="dragon-horn right"></div><div class="dragon-eye left"></div><div class="dragon-eye right"></div>',
    snake:'<div class="snake-body"></div><div class="snake-eye left"></div><div class="snake-eye right"></div>',
    horse:'<div class="horse-face"></div><div class="horse-mane"></div><div class="horse-eye left"></div><div class="horse-eye right"></div>',
    goat:'<div class="goat-face"></div><div class="goat-horn left"></div><div class="goat-horn right"></div><div class="goat-eye left"></div><div class="goat-eye right"></div>',
    monkey:'<div class="monkey-face"></div><div class="monkey-ear left"></div><div class="monkey-ear right"></div><div class="monkey-eye left"></div><div class="monkey-eye right"></div>',
    rooster:'<div class="rooster-face"></div><div class="rooster-comb"></div><div class="rooster-eye left"></div><div class="rooster-eye right"></div>',
    dog:'<div class="dog-face"></div><div class="dog-ear"></div><div class="dog-ear right"></div><div class="dog-eye left"></div><div class="dog-eye right"></div>',
    pig:'<div class="pig-face"></div><div class="pig-snout"></div>'
  };
  return f[t]||""
}
function render(){
  document.getElementById("count").textContent=pets.length;
  var c=document.getElementById("petsContainer");
  if(pets.length===0){
    c.innerHTML='<div class="empty"><div class="ic">🐾</div><h2>还没有宠物~</h2><p>快来领养一只生肖守护神吧！</p><button class="new-btn" onclick="showAdopt()">领养宠物</button></div>';
    return
  }
  var html="";
  for(var i=0;i<pets.length;i++){
    var p=pets[i];
    var s=getStatus(p);
    html+='<div class="card">';
    html+='<div class="card-top"><div class="name">'+p.name+'</div><div class="level">Lv.'+p.level+'</div></div>';
    html+='<div class="avatar-wrap"><div class="avatar" id="av'+p.id+'">'+getAvatar(p.type)+'</div></div>';
    html+='<div class="stats">';
    html+='<div class="stat"><span class="stat-icon">🍖</span><div class="stat-bar"><div class="bar hunger" style="width:'+p.hunger+'%"></div></div></div>';
    html+='<div class="stat"><span class="stat-icon">😊</span><div class="stat-bar"><div class="bar happy" style="width:'+p.happy+'%"></div></div></div>';
    html+='<div class="stat"><span class="stat-icon">⚡</span><div class="stat-bar"><div class="bar energy" style="width:'+p.energy+'%"></div></div></div>';
    html+='</div>';
    html+='<div class="status '+s.cls+'">'+s.text+'</div>';
    html+='<div class="actions">';
    html+='<button class="btn feed" data-id="'+p.id+'">🍖<span>喂食</span></button>';
    html+='<button class="btn play" data-id="'+p.id+'">🎮<span>玩耍</span></button>';
    html+='<button class="btn sleep" data-id="'+p.id+'">'+(p.sleeping?"☀️":"😴")+'<span>'+(p.sleeping?"唤醒":"睡觉")+'</span></button>';
    html+='</div></div>'
  }
  c.innerHTML=html;
  var btns=c.querySelectorAll(".btn");
  for(var j=0;j<btns.length;j++){
    btns[j].onclick=(function(b){
      return function(){
        var id=b.getAttribute("data-id");
        if(b.classList.contains("feed")){showFeed(id)}
        else if(b.classList.contains("play")){play(id)}
        else if(b.classList.contains("sleep")){sleep(id)}
      }
    })(btns[j])
  }
}
window.showAdopt=showAdopt;
init()
})()
</script>
</body>
</html>
