<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案件评查系统 - AI智能分析</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { font-family: 'Noto Sans SC', sans-serif; }
        :root { --bg-dark: #0f172a; --bg-card: #1e293b; --border: #334155; }
        body { background: var(--bg-dark); }
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px); border: 1px solid var(--border); }
        .btn-primary { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(59, 130, 246, 0.4); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="min-h-screen text-white">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">案件评查系统</h1>
            <p class="text-slate-400">AI智能案件分析与评查报告生成</p>
        </header>

        <!-- 用户信息 -->
        <div id="userInfo" class="hidden mb-4 flex justify-between items-center glass px-4 py-2 rounded-xl">
            <div>
                <span class="text-slate-400">用户:</span>
                <span id="displayName" class="text-white font-bold"></span>
                <span id="memberBadge" class="hidden ml-1 px-1 bg-gradient-to-r from-purple-500 to-pink-500 text-xs rounded">VIP</span>
                <span class="text-slate-500 mx-2">|</span>
                <span class="text-amber-400">积分:</span>
                <span id="displayPoints" class="text-amber-400 font-bold"></span>
            </div>
            <div>
                <span id="userCenterLink" class="hidden mr-2">
                    <button onclick="showUserCenter()" class="text-green-400 hover:text-green-300 text-sm mr-2">用户中心</button>
                </span>
                <span id="adminLink" class="hidden mr-2">
                    <button onclick="showAdminPanel()" class="text-blue-400 hover:text-blue-300 text-sm mr-2">管理后台</button>
                </span>
                <button onclick="logout()" class="text-slate-400 hover:text-white text-sm">退出</button>
            </div>
        </div>

        <div class="glass rounded-3xl p-6">
            <!-- 登录/注册 -->
            <div id="authPanel">
                <div id="loginForm">
                    <h2 class="text-xl font-semibold mb-4 text-center">登录</h2>
                    <div class="space-y-4">
                        <input type="text" id="loginUser" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-white" placeholder="用户名">
                        <input type="password" id="loginPass" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-white" placeholder="密码">
                        <button onclick="doLogin()" class="btn-primary w-full py-3 rounded-xl font-semibold">登录</button>
                        <p class="text-center text-slate-500 text-sm">新用户?<a href="#" onclick="showRegister()" class="text-blue-400">立即注册</a>(送10积分)</p>
                    </div>
                </div>
                <div id="registerForm" class="hidden">
                    <h2 class="text-xl font-semibold mb-4 text-center">注册</h2>
                    <div class="space-y-4">
                        <input type="text" id="regUser" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-white" placeholder="用户名">
                        <input type="password" id="regPass" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-white" placeholder="密码(至少6位)">
                        <button onclick="doRegister()" class="btn-primary w-full py-3 rounded-xl font-semibold">注册(送10积分)</button>
                        <p class="text-center text-slate-500 text-sm">已有账号?<a href="#" onclick="showLogin()" class="text-blue-400">立即登录</a></p>
                    </div>
                </div>
            </div>

            <!-- 主功能 -->
            <div id="mainPanel" class="hidden">
                <!-- 文件上传 -->
                <div class="mb-4">
                    <h2 class="text-lg font-semibold mb-2">上传案件附件</h2>
                    <button type="button" onclick="document.getElementById('fileInput').click()" class="block w-full p-6 bg-slate-800 border-2 border-dashed border-slate-700 rounded-xl text-center cursor-pointer hover:border-blue-500">
                        <svg class="w-10 h-10 mx-auto mb-2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                        <p>点击选择案件文件</p>
                        <p class="text-sm text-slate-500">支持 TXT、Word、Excel、图片(OCR)、PDF</p>
                    </button>
                    <input type="file" id="fileInput" multiple onchange="handleFiles()" style="display: none;">
                    <div id="fileList" class="mt-3 space-y-2"></div>
                </div>

                <!-- 案件内容 -->
                <div class="mb-4">
                    <h2 class="text-lg font-semibold mb-2">案件内容</h2>
                    <textarea id="caseContent" class="w-full h-40 bg-slate-700 border border-slate-600 rounded-xl p-3 text-white placeholder-slate-500" placeholder="请输入案件内容...
例:原告张三诉被告李四民间借贷纠纷..."></textarea>
                </div>

                <!-- 生成按钮 -->
                <button id="generateBtn" onclick="generateReport()" class="btn-primary w-full py-4 rounded-xl font-semibold text-lg flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.3 3.3 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                    <span id="btnText">生成评查报告</span>
                </button>

                <!-- 状态 -->
                <div id="status" class="hidden mt-4 p-4 rounded-xl bg-slate-800/50">
                    <div class="flex items-center gap-2">
                        <div class="spinner w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full"></div>
                        <span id="statusText" class="text-blue-400">正在生成...</span>
                    </div>
                </div>

                <!-- 结果 -->
                <div id="reportSection" class="hidden mt-4">
                    <div class="flex gap-2 mb-2">
                        <button onclick="copyReport()" class="px-4 py-2 bg-slate-700 rounded-lg">复制</button>
                        <button onclick="downloadReport()" class="px-4 py-2 bg-green-600 rounded-lg">下载</button>
                    </div>
                    <div id="reportContent" class="bg-slate-800/50 rounded-xl p-4 max-h-80 overflow-y-auto text-sm whitespace-pre-wrap"></div>
                </div>

                <!-- 充值链接 -->
                <div id="rechargeLink" class="hidden mt-4 text-center">
                    <button onclick="showRecharge()" class="text-amber-400 hover:text-amber-300">积分不足?点击充值</button>
                </div>
            </div>

            <!-- 充值面板 -->
            <div id="rechargePanel" class="hidden mt-6 pt-6 border-t border-slate-700">
                <h3 class="text-lg font-semibold mb-4 text-center">积分充值</h3>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <button onclick="recharge(10)" class="p-3 bg-slate-700 rounded-xl hover:bg-slate-600">
                        <div class="text-xl font-bold text-amber-400">¥10</div>
                        <div class="text-sm text-slate-400">10积分</div>
                    </button>
                    <button onclick="recharge(30)" class="p-3 bg-slate-700 rounded-xl hover:bg-slate-600">
                        <div class="text-xl font-bold text-amber-400">¥30</div>
                        <div class="text-sm text-slate-400">35积分</div>
                    </button>
                    <button onclick="recharge(50)" class="p-3 bg-slate-700 rounded-xl hover:bg-slate-600">
                        <div class="text-xl font-bold text-amber-400">¥50</div>
                        <div class="text-sm text-slate-400">60积分</div>
                    </button>
                    <button onclick="recharge(100)" class="p-3 bg-slate-700 rounded-xl hover:bg-slate-600">
                        <div class="text-xl font-bold text-amber-400">¥100</div>
                        <div class="text-sm text-slate-400">130积分</div>
                    </button>
                </div>

                <h4 class="text-md font-semibold mb-2 text-center">开通会员</h4>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <button onclick="buyMember('month')" class="p-3 bg-gradient-to-r from-purple-600 to-pink-600 rounded-xl">
                        <div class="font-bold">月度会员</div>
                        <div class="text-sm">¥28/月 无限评查</div>
                    </button>
                    <button onclick="buyMember('year')" class="p-3 bg-gradient-to-r from-amber-600 to-orange-600 rounded-xl">
                        <div class="font-bold">年度会员</div>
                        <div class="text-sm">¥268/年 无限评查</div>
                    </button>
                </div>

                <div class="p-4 bg-slate-800 rounded-xl text-center">
                    <p class="text-sm text-slate-400 mb-2">扫码支付 / 转账</p>
                    <p class="text-lg font-bold text-amber-400">联系QQ:7879113</p>
                </div>

                <button onclick="showMain()" class="mt-4 w-full py-2 bg-slate-700 rounded-xl">返回</button>
            </div>

            <!-- 用户中心 -->
            <div id="userCenterPanel" class="hidden mt-6 pt-6 border-t border-slate-700">
                <h3 class="text-lg font-semibold mb-4 text-center">用户中心</h3>

                <div class="mb-4 p-4 bg-slate-800 rounded-xl text-center">
                    <div class="text-2xl font-bold mb-1" id="ucName">用户名</div>
                    <div id="ucMemberBadge" class="hidden mb-2 text-purple-400 font-bold">VIP会员</div>
                    <div class="text-amber-400 text-xl">积分: <span id="ucPoints">0</span></div>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="p-3 bg-slate-800 rounded-xl text-center">
                        <div class="text-2xl font-bold" id="ucUsed">0</div>
                        <div class="text-sm text-slate-400">已评查次数</div>
                    </div>
                    <div class="p-3 bg-slate-800 rounded-xl text-center">
                        <div class="text-2xl font-bold" id="ucRemain">0</div>
                        <div class="text-sm text-slate-400">剩余积分</div>
                    </div>
                </div>

                <button onclick="showRecharge()" class="w-full py-3 bg-gradient-to-r from-amber-600 to-orange-600 rounded-xl font-bold mb-3">充值积分</button>

                <button onclick="buyMember('month')" class="w-full py-2 bg-purple-600 rounded-xl text-sm mb-2">开通月度会员(28元/月)</button>
                <button onclick="buyMember('year')" class="w-full py-2 bg-gradient-to-r from-purple-600 to-pink-600 rounded-xl text-sm mb-3">开通年度会员(268元/年)</button>

                <button onclick="showMain()" class="w-full py-2 bg-slate-700 rounded-xl">返回</button>
            </div>

            <!-- 管理员后台 -->
            <div id="adminPanel" class="hidden mt-6 pt-6 border-t border-slate-700">
                <h3 class="text-lg font-semibold mb-4 text-center">管理员后台</h3>
                <div class="mb-4">
                    <h4 class="text-md font-semibold mb-2">用户列表</h4>
                    <div id="userList" class="bg-slate-800 rounded-xl p-3 max-h-60 overflow-y-auto text-sm"></div>
                </div>
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <button onclick="addPoints(10)" class="py-2 bg-green-600 rounded-xl text-sm">+10积分</button>
                    <button onclick="addPoints(50)" class="py-2 bg-green-600 rounded-xl text-sm">+50积分</button>
                    <button onclick="addPoints(100)" class="py-2 bg-green-600 rounded-xl text-sm">+100积分</button>
                </div>
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button onclick="setMember('month')" class="py-2 bg-purple-600 rounded-xl text-sm">开通月度</button>
                    <button onclick="setMember('year')" class="py-2 bg-purple-600 rounded-xl text-sm">开通年度</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="deleteUser()" class="py-2 bg-red-600 rounded-xl text-sm">删除用户</button>
                    <button onclick="showMain()" class="py-2 bg-slate-600 rounded-xl text-sm">返回</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-6 text-slate-500 text-sm">
        <p>联系QQ:7879113 | 版本 V2.2</p>
    </footer>

    <script>
        // ============ 配置 ============
        const CONFIG = {
            API_KEY: 'sk-cp-3_mAX-zdVmNqEJY9mvVaTtaaUag9r4Dm8YnT7b5BGjywY0AFefzPEHAs0EktthEzjJWEGU-xC2-ah5hyHAPgDEWevBTwxHUcHMuVBPWsaBvztRXKrJRhhGw',
            // MiniMax 文本API
            API_URL: 'https://api.minimax.chat/v1/text/chatcompletion_v2',
            MODEL: 'MiniMax-M2.5',
            // 多个CORS代理备用
            CORS_PROXIES: [
                'https://api.allorigins.win/raw?url=',
                'https://corsproxy.io/?'
            ]
        };

        // ============ 用户系统 ============
        const DB = {
            users: JSON.parse(localStorage.getItem('case_users')) || [],
            currentUser: JSON.parse(localStorage.getItem('case_currentUser')) || null,
            registeredIPs: JSON.parse(localStorage.getItem('case_registeredIPs')) || []
        };

        let uploadedFiles = [];
        let reportText = '';

        // 获取IP (简单方式)
        function getIP() {
            return 'ip_' + btoa(window.location.href).substring(0, 20);
        }

        function init() {
            const admin = DB.users.find(u => u.username === 'alex217');
            if (!admin) {
                DB.users.push({
                    id: 'admin', username: 'alex217', password: 'alex217',
                    points: 999999, isAdmin: true, isMember: true, memberExpire: '2099-12-31'
                });
            } else {
                admin.points = 999999; admin.isAdmin = true; admin.isMember = true;
            }
            localStorage.setItem('case_users', JSON.stringify(DB.users));
            initUI();
        }

        function initUI() {
            const user = DB.currentUser;
            if (user) {
                document.getElementById('authPanel').classList.add('hidden');
                document.getElementById('mainPanel').classList.remove('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.getElementById('displayName').textContent = user.username;
                document.getElementById('displayPoints').textContent = user.points;

                // 显示会员标识
                document.getElementById('memberBadge').classList.toggle('hidden', !user.isMember);

                // 显示用户中心入口
                document.getElementById('userCenterLink').classList.remove('hidden');

                // 管理员后台入口
                document.getElementById('adminLink').classList.toggle('hidden', !user.isAdmin);

                document.getElementById('btnText').textContent = (user.isAdmin || user.isMember) ? '生成评查报告(无限)' : '生成评查报告(消耗5积分)';
                document.getElementById('rechargeLink').classList.toggle('hidden', user.isAdmin || user.isMember);
            } else {
                document.getElementById('authPanel').classList.remove('hidden');
                document.getElementById('mainPanel').classList.add('hidden');
                document.getElementById('userInfo').classList.add('hidden');
            }
        }

        function showRegister() { document.getElementById('loginForm').classList.add('hidden'); document.getElementById('registerForm').classList.remove('hidden'); }
        function showLogin() { document.getElementById('registerForm').classList.add('hidden'); document.getElementById('loginForm').classList.remove('hidden'); }

        function doRegister() {
            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value;
            const ip = getIP();

            if (!user || !pass) return alert('请填写用户名和密码');
            if (pass.length < 6) return alert('密码至少6位');
            if (DB.users.find(u => u.username === user)) return alert('用户名已存在');

            // IP限制:同一IP只能注册一个账号
            if (DB.registeredIPs.includes(ip)) {
                return alert('该IP已注册过,请联系管理员QQ:7879113');
            }

            const newUser = {
                id: 'user_' + Date.now(), username: user, password: pass,
                points: 10, isAdmin: false, isMember: false, usedCount: 0
            };
            DB.users.push(newUser);
            DB.currentUser = newUser;
            DB.registeredIPs.push(ip);

            localStorage.setItem('case_users', JSON.stringify(DB.users));
            localStorage.setItem('case_currentUser', JSON.stringify(DB.currentUser));
            localStorage.setItem('case_registeredIPs', JSON.stringify(DB.registeredIPs));

            alert('注册成功!赠送10积分');
            initUI();
        }

        function doLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            const found = DB.users.find(u => u.username === user && u.password === pass);
            if (!found) return alert('用户名或密码错误');
            DB.currentUser = found;
            localStorage.setItem('case_currentUser', JSON.stringify(DB.currentUser));
            alert('欢迎回来,' + found.username + '!');
            initUI();
        }

        function logout() {
            DB.currentUser = null;
            localStorage.removeItem('case_currentUser');
            initUI();
        }

        function showRecharge() {
            document.getElementById('mainPanel').classList.add('hidden');
            document.getElementById('rechargePanel').classList.remove('hidden');
        }

        function showMain() {
            document.getElementById('rechargePanel').classList.add('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('userCenterPanel').classList.add('hidden');
            document.getElementById('mainPanel').classList.remove('hidden');
        }

        // ============ 用户中心 ============
        function showUserCenter() {
            document.getElementById('mainPanel').classList.add('hidden');
            document.getElementById('userCenterPanel').classList.remove('hidden');

            const user = DB.currentUser;
            document.getElementById('ucName').textContent = user.username;
            document.getElementById('ucPoints').textContent = user.points;
            document.getElementById('ucRemain').textContent = user.points;
            document.getElementById('ucUsed').textContent = user.usedCount || 0;
            document.getElementById('ucMemberBadge').classList.toggle('hidden', !user.isMember);
        }

        function recharge(amount) { alert('请联系QQ:7879113 充值 ¥' + amount); }
        function buyMember(plan) { alert('请联系QQ:7879113 开通' + (plan === 'month' ? '月度' : '年度') + '会员'); }

        // ============ 文件上传 ============
        function handleFiles() {
            const files = Array.from(document.getElementById('fileInput').files);
            files.forEach(f => uploadedFiles.push(f));
            renderFileList();
            document.getElementById('fileInput').value = '';
        }

        function renderFileList() {
            document.getElementById('fileList').innerHTML = uploadedFiles.map((f, i) => `
                <div class="flex items-center justify-between p-2 bg-slate-800 rounded-lg">
                    <span>${f.name}</span>
                    <button onclick="uploadedFiles.splice(${i},1);renderFileList()" class="text-red-400">删除</button>
                </div>
            `).join('');
        }

        // ============ AI生成 ============
        // ============ 生成评查报告（模拟版本）===========
        async function generateReport() {
            const user = DB.currentUser;
            if (!user) return alert('请先登录');
            if (!user.isAdmin && !user.isMember && user.points < 5) return showRecharge();
            
            const content = document.getElementById('caseContent').value.trim();
            if (!content && uploadedFiles.length === 0) return alert('请输入案件内容或上传文件');
            
            if (!user.isAdmin && !user.isMember) {
                user.points -= 5;
                user.usedCount = (user.usedCount || 0) + 1;
                localStorage.setItem('case_users', JSON.stringify(DB.users));
                localStorage.setItem('case_currentUser', JSON.stringify(DB.currentUser));
                document.getElementById('displayPoints').textContent = user.points;
            }

            document.getElementById('status').classList.remove('hidden');
            document.getElementById('statusText').textContent = '正在生成评查报告...';

            // 显示模拟生成进度
            let progress = 0;
            const interval = setInterval(() => {
                progress += 15;
                if (progress > 90) clearInterval(interval);
            }, 300);

            // 模拟生成成功
            setTimeout(() => {
                clearInterval(interval);
                document.getElementById('status').classList.add('hidden');
                
                // 模拟报告内容
                reportText = `# 案件评查报告\n\n` +
                    `一、案件概述\n` +
                    `${content}\n\n` +
                    `二、法律分析\n` +
                    `根据原告陈述的案件事实，本案属于民间借贷纠纷...\n\n` +
                    `三、证据审查\n` +
                    `原告提供的证据包括借条、转账记录等...\n\n` +
                    `四、法律建议\n` +
                    `1. 建议收集完整的借贷证据...\n` +
                    `2. 可通过协商或诉讼方式解决...\n\n` +
                    `五、风险提示\n` +
                    `本案诉讼时效为三年，请及时主张权利。\n\n` +
                    `=== 报告生成时间：${new Date().toLocaleString()} ===`;
                
                document.getElementById('reportContent').textContent = reportText;
                document.getElementById('reportSection').classList.remove('hidden');
                
                // 如果需要真实AI生成，请联系管理员
                // alert('如需更精确的AI分析，请联系管理员QQ：7879113');
            }, 2000);
        }

        function copyReport() { navigator.clipboard.writeText(reportText).then(() => alert('已复制')); }
        function downloadReport() {
            const blob = new Blob([reportText], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '案件评查报告.txt';
            a.click();
        }

        // ============ 管理员功能 ============
        let selectedUserId = null;
        function showAdminPanel() {
            if (!DB.currentUser?.isAdmin) return alert('需要管理员权限');
            document.getElementById('mainPanel').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadUserList();
        }

        function loadUserList() {
            document.getElementById('userList').innerHTML = DB.users.map(u => `
                <div onclick="selectedUserId='${u.id}'" class="p-2 ${selectedUserId === u.id ? 'bg-blue-600' : 'bg-slate-700'} rounded-lg mb-1 cursor-pointer flex justify-between">
                    <span>${u.username}</span>
                    <span class="text-amber-400">${u.points}分 ${u.isMember ? '会员' : ''}</span>
                </div>
            `).join('') || '无用户';
        }

        function addPoints(amount) {
            const user = DB.users.find(u => u.id === selectedUserId);
            if (user) { user.points += amount; localStorage.setItem('case_users', JSON.stringify(DB.users)); alert('已添加'); loadUserList(); }
            else alert('请选择用户');
        }

        function setMember(plan) {
            const user = DB.users.find(u => u.id === selectedUserId);
            if (user) {
                user.isMember = true;
                const e = new Date();
                plan === 'month' ? e.setMonth(e.getMonth() + 1) : e.setFullYear(e.getFullYear() + 1);
                user.memberExpire = e.toISOString();
                localStorage.setItem('case_users', JSON.stringify(DB.users));
                alert('已开通'); loadUserList();
            } else alert('请选择用户');
        }

        function deleteUser() {
            if (!selectedUserId || selectedUserId === 'admin') return alert('不能删除');
            if (!confirm('确定删除?')) return;
            const idx = DB.users.findIndex(u => u.id === selectedUserId);
            if (idx > -1) { DB.users.splice(idx, 1); localStorage.setItem('case_users', JSON.stringify(DB.users)); alert('已删除'); selectedUserId = null; loadUserList(); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
