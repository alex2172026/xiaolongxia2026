<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的宠物乐园</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Nunito,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes float{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 5px))}}
@keyframes look{0%,30%,100%{transform:translate(-50%,-50%)}35%,45%{transform:translate(-40%,-50%)}75%,85%{transform:translate(-60%,-50%)}}
@keyframes antL{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-35deg)}}
@keyframes antR{0%,100%{transform:rotate(20deg)}50%{transform:rotate(35deg)}}
@keyframes tail{0%,100%{transform:translateX(-50%) rotate(-10deg)}50%{transform:translateX(-50%) rotate(10deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
@keyframes tailSway{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
@keyframes tongue{0%,70%,100%{height:15px}80%,90%{height:22px}}
@keyframes earWiggle{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(-10deg)}}
@keyframes wing{0%,100%{transform:translateX(-50%) rotate(0deg)}50%{transform:translateX(-50%) rotate(-15deg)}}
@keyframes happy{0%,100%{transform:translateY(0)}25%{transform:translateY(-15px) scale(1.1)}50%{transform:translateY(-8px)}75%{transform:translateY(-12px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes toastIn{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.container{max-width:900px;margin:0 auto}
h1{color:#fff;text-align:center;font-size:2em;animation:bounce 2s infinite}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px}
.stats-bar{background:rgba(255,255,255,0.2);padding:10px 20px;border-radius:20px;color:#fff;font-weight:600}
.new-egg-btn{background:linear-gradient(#f093fb,#f5576c);color:#fff;border:none;padding:12px 24px;border-radius:25px;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.3s}
.new-egg-btn:hover{transform:scale(1.05);box-shadow:0 5px 20px rgba(240,147,251,0.5)}
.pets{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.15);animation:slideUp 0.4s ease;transition:transform 0.3s}
.card:hover{transform:translateY(-5px)}
.card-header{display:flex;justify-content:space-between;margin-bottom:10px}
.name{font-size:20px;font-weight:700;color:#2d3748}
.level{background:linear-gradient(#ffd700,#ffb347);color:#fff;padding:5px 12px;border-radius:15px;font-size:12px}
.avatar{width:100px;height:100px;margin:15px auto;position:relative;cursor:pointer;transition:transform 0.3s}
.avatar:hover{transform:scale(1.1)}
.avatar:active{transform:scale(0.95)}
.avatar.happy{animation:happy 0.6s ease}
.pc-body{position:absolute;width:60px;height:70px;background:linear-gradient(#e74c3c,#c0392b);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);animation:float 3s infinite}
.pc-eye{position:absolute;width:12px;height:14px;background:#fff;border-radius:50%;top:10px}
.pc-eye.left{left:15px}
.pc-eye.right{right:15px}
.pc-eye::after{content:"";position:absolute;width:8px;height:8px;background:#1a1a2e;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);animation:look 4s infinite}
.pc-ant{position:absolute;width:3px;height:25px;background:#e74c3c;border-radius:50%;top:-15px}
.pc-ant.left{left:30px;animation:antL 2s infinite}
.pc-ant.right{right:30px;animation:antR 2s infinite}
.pc-claw{position:absolute;width:25px;height:35px;background:#e74c3c;border-radius:50%;top:35px}
.pc-claw.left{left:0;transform:rotate(25deg)}
.pc-claw.right{right:0;transform:rotate(-25deg)}
.pc-tail{position:absolute;width:30px;height:20px;background:#c0392b;border-radius:0 0 50% 50%;bottom:0;left:50%;transform:translateX(-50%);animation:tail 0.8s infinite}
.pca-body{position:absolute;width:70px;height:50px;background:linear-gradient(#f5a623,#e8941c);border-radius:50%;left:50%;top:55%;transform:translate(-50%,-50%);animation:float 2.5s infinite}
.pca-head{position:absolute;width:65px;height:55px;background:#f5a623;border-radius:50%;left:50%;top:15px;transform:translateX(-50%)}
.pca-ear{position:absolute;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:20px solid #e8941c;top:0}
.pca-ear.left{left:12px;transform:rotate(-15deg)}
.pca-ear.right{right:12px;transform:rotate(15deg)}
.pca-eye{position:absolute;width:14px;height:16px;background:#2ecc71;border-radius:50%;top:25px;animation:blink 4s infinite}
.pca-eye.left{left:15px}
.pca-eye.right{right:15px}
.pca-eye::after{content:"";position:absolute;width:3px;height:10px;background:#1a1a2e;border-radius:2px;top:3px;left:5px}
.pca-nose{position:absolute;width:8px;height:6px;background:#ff6b81;border-radius:50%;top:42px;left:50%;transform:translateX(-50%)}
.pca-tail{position:absolute;width:12px;height:40px;background:#e8941c;border-radius:10px;right:5px;top:40px;transform-origin:bottom;animation:tailSway 2s infinite}
.pd-body{position:absolute;width:65px;height:45px;background:linear-gradient(#8b4513,#654321);border-radius:50%;left:50%;top:55%;transform:translate(-50%,-50%);animation:float 2s infinite}
.pd-head{position:absolute;width:60px;height:55px;background:#8b4513;border-radius:50%;left:50%;top:12px;transform:translateX(-50%)}
.pd-eye{position:absolute;width:14px;height:14px;background:#1a1a2e;border-radius:50%;top:24px}
.pd-eye.left{left:12px}
.pd-eye.right{right:12px}
.pd-eye::after{content:"";position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;top:2px;left:2px}
.pd-nose{position:absolute;width:14px;height:10px;background:#1a1a2e;border-radius:50%;top:36px;left:50%;transform:translateX(-50%)}
.pd-tongue{position:absolute;width:10px;height:15px;background:#ff6b6b;border-radius:0 0 50% 50%;top:46px;left:50%;transform:translateX(-50%);animation:tongue 3s infinite}
.pd-tail{position:absolute;width:10px;height:30px;background:#8b4513;border-radius:10px;right:8px;top:30px;transform-origin:bottom;animation:tail 0.4s infinite}
.pr-body{position:absolute;width:60px;height:55px;background:#fff;border-radius:50%;left:50%;top:55%;transform:translate(-50%,-50%);animation:float 2.8s infinite}
.pr-head{position:absolute;width:50px;height:45px;background:#fff;border-radius:50%;left:50%;top:18px;transform:translateX(-50%)}
.pr-ear{position:absolute;width:14px;height:45px;background:#fff;border-radius:50%;top:-20px;animation:earWiggle 2s infinite}
.pr-ear.left{left:22px;transform:rotate(-15deg)}
.pr-ear.right{right:22px;transform:rotate(15deg)}
.pr-ear::after{content:"";position:absolute;width:8px;height:35px;background:pink;border-radius:50%;top:4px;left:3px}
.pr-eye{position:absolute;width:10px;height:10px;background:#e74c3c;border-radius:50%;top:25px}
.pr-eye.left{left:15px}
.pr-eye.right{right:15px}
.pr-tail{position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;bottom:20px;left:50%;transform:translateX(-50%);animation:pulse 0.5s infinite}
.pb-body{position:absolute;width:45px;height:50px;background:linear-gradient(#3498db,#2980b9);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);animation:float 2.2s infinite}
.pb-head{position:absolute;width:40px;height:40px;background:#3498db;border-radius:50%;left:50%;top:8px;transform:translateX(-50%)}
.pb-eye{position:absolute;width:10px;height:10px;background:#fff;border-radius:50%;top:15px}
.pb-eye.left{left:10px}
.pb-eye.right{right:10px}
.pb-eye::after{content:"";position:absolute;width:6px;height:6px;background:#1a1a2e;border-radius:50%;top:2px;left:2px}
.pb-beak{position:absolute;width:0;height:0;border-top:6px solid transparent;border-bottom:8px solid transparent;border-left:14px solid #f39c12;top:24px;left:50%;transform:translateX(-50%);z-index:1}
.pb-wing{position:absolute;width:25px;height:30px;background:#2980b9;border-radius:50%;top:30px;left:50%;transform:translateX(-50%);transform-origin:top;animation:wing 0.5s infinite}
.pp-body{position:absolute;width:65px;height:50px;background:#fff;border-radius:50%;left:50%;top:55%;transform:translate(-50%,-50%);animation:float 3s infinite}
.pp-head{position:absolute;width:70px;height:60px;background:#fff;border-radius:50%;left:50%;top:10px;transform:translateX(-50%)}
.pp-ear{position:absolute;width:25px;height:25px;background:#1a1a2e;border-radius:50%;top:0}
.pp-ear.left{left:5px}
.pp-ear.right{right:5px}
.pp-patch{position:absolute;width:20px;height:16px;background:#1a1a2e;border-radius:50%;top:22px}
.pp-patch.left{left:10px;transform:rotate(-10deg)}
.pp-patch.right{right:10px;transform:rotate(10deg)}
.pp-eye{position:absolute;width:10px;height:10px;background:#fff;border-radius:50%;top:24px}
.pp-eye.left{left:15px}
.pp-eye.right{right:15px}
.pp-eye::after{content:"";position:absolute;width:5px;height:5px;background:#1a1a2e;border-radius:50%;top:2px;left:2px}
.ppe-body{position:absolute;width:60px;height:70px;background:#1a1a2e;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);animation:float 2.6s infinite}
.ppe-belly{position:absolute;width:40px;height:50px;background:#fff;border-radius:50%;left:50%;top:30px;transform:translateX(-50%)}
.ppe-head{position:absolute;width:50px;height:40px;background:#1a1a2e;border-radius:50%;left:50%;top:5px;transform:translateX(-50%)}
.ppe-eye{position:absolute;width:10px;height:10px;background:#fff;border-radius:50%;top:15px}
.ppe-eye.left{left:12px}
.ppe-eye.right{right:12px}
.ppe-eye::after{content:"";position:absolute;width:6px;height:6px;background:#1a1a2e;border-radius:50%;top:2px;left:2px}
.ppe-beak{position:absolute;width:0;height:0;border-top:8px solid #f39c12;border-left:8px solid transparent;border-right:8px solid transparent;top:28px;left:50%;transform:translateX(-50%)}
.ppe-wing{position:absolute;width:12px;height:30px;background:#1a1a2e;border-radius:50%;top:30px;animation:wing 1s infinite}
.ppe-wing.left{left:0;transform:rotate(15deg)}
.ppe-wing.right{right:0;transform:rotate(-15deg)}
.ppe-foot{position:absolute;width:16px;height:8px;background:#f39c12;border-radius:50%;bottom:5px}
.ppe-foot.left{left:20px}
.ppe-foot.right{right:20px}
.stats{margin:15px 0}
.stat{display:flex;align-items:center;margin-bottom:6px}
.stat-icon{width:20px}
.stat-bar{flex:1;height:10px;background:#edf2f7;border-radius:5px;margin:0 8px;overflow:hidden}
.bar{height:100%;border-radius:5px;transition:width 0.5s}
.bar.hunger{background:linear-gradient(#f56565,#e53e3e)}
.bar.happy{background:linear-gradient(#48bb78,#38a169)}
.bar.energy{background:linear-gradient(#4299e1,#3182ce)}
.stat-value{width:24px;text-align:right;font-size:12px;color:#4a5568}
.status{text-align:center;padding:8px;background:#f7fafc;border-radius:10px;margin-bottom:15px;font-size:13px;animation:pulse 2s infinite}
.status.hungry{background:#fed7d7;color:#c53030}
.status.tired{background:#feebc8;color:#c05621}
.status.sad{background:#e9d8fd;color:#6b46c1}
.status.happy{background:#c6f6d5;color:#276749}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.action{background:none;border:none;border-radius:12px;padding:10px;font-size:24px;cursor:pointer;transition:all 0.3s}
.action:hover{transform:translateY(-3px) scale(1.05)}
.action span{display:block;font-size:10px;margin-top:2px}
.action.feed{background:linear-gradient(#fbb6ce,#f687b3)}
.action.play{background:linear-gradient(#90cdf4,#4299e1)}
.action.sleep{background:linear-gradient(#c3dafe,#a3bffa)}
.panel{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px)}
.panel.show{display:flex;animation:fadeIn 0.3s}
.modal{background:#fff;border-radius:25px;padding:25px;max-width:400px;width:90%;animation:slideUp 0.4s;position:relative}
.modal h2,.modal h3{text-align:center;color:#2d3748;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.item{background:#f7fafc;border-radius:15px;padding:15px;text-align:center;cursor:pointer;transition:all 0.3s}
.item:hover{border:2px solid #667eea;transform:translateY(-5px)}
.item:hover .icon{transform:scale(1.2)}
.item .icon{font-size:40px;display:block;margin-bottom:5px;transition:transform 0.3s}
.item .name{font-size:13px;font-weight:600;color:#2d3748}
.item .effect{font-size:10px;color:#718096}
.close{position:absolute;top:10px;right:10px;width:30px;height:30px;background:#f7fafc;border:none;border-radius:50%;font-size:16px;cursor:pointer}
.close:hover{background:#e2e8f0}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:linear-gradient(#667eea,#764ba2);color:#fff;padding:12px 25px;border-radius:20px;font-size:14px;opacity:0;transition:all 0.3s;z-index:2000}
.toast.show{opacity:1;animation:toastIn 0.5s}
.empty{text-align:center;padding:60px 20px}
.empty .icon{font-size:80px;margin-bottom:15px;animation:pulse 2s infinite}
.empty h2{color:#fff;margin-bottom:10px}
.empty p{color:rgba(255,255,255,0.8);margin-bottom:20px}
</style>
</head>
<body>
<div class="container">
<h1>我的宠物乐园</h1>
<div class="header">
<div class="stats-bar">宠物: <span id="count">0</span>只</div>
<button class="new-egg-btn" onclick="showPanel()">领养宠物</button>
</div>
<div class="pets" id="pets"></div>
</div>

<div class="panel" id="panel">
<div class="modal">
<h2>选择宠物</h2>
<div class="grid">
<div class="item" onclick="hatch('crayfish')"><span class="icon">🦞</span><span class="name">小龙虾</span></div>
<div class="item" onclick="hatch('cat')"><span class="icon">🐱</span><span class="name">小猫咪</span></div>
<div class="item" onclick="hatch('dog')"><span class="icon">🐶</span><span class="name">小狗狗</span></div>
<div class="item" onclick="hatch('rabbit')"><span class="icon">🐰</span><span class="name">小兔子</span></div>
<div class="item" onclick="hatch('bird')"><span class="icon">🐦</span><span class="name">小鸟</span></div>
<div class="item" onclick="hatch('panda')"><span class="icon">🐼</span><span class="name">小熊猫</span></div>
<div class="item" onclick="hatch('penguin')"><span class="icon">🐧</span><span class="name">小企鹅</span></div>
</div>
</div>
</div>

<div class="panel" id="foodPanel">
<div class="modal">
<h3>喂食</h3>
<div class="grid">
<div class="item" onclick="feed('apple')"><span class="icon">🍎</span><span class="name">苹果</span><span class="effect">+15饱食</span></div>
<div class="item" onclick="feed('carrot')"><span class="icon">🥕</span><span class="name">胡萝卜</span><span class="effect">+12饱食</span></div>
<div class="item" onclick="feed('fish')"><span class="icon">🐟</span><span class="name">小鱼干</span><span class="effect">+20饱食</span></div>
<div class="item" onclick="feed('cake')"><span class="icon">🍰</span><span class="name">小蛋糕</span><span class="effect">+25饱食</span></div>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
let pets=[];
let curId=null;
const N={crayfish:"小龙虾",cat:"小猫咪",dog:"小狗狗",rabbit:"小兔子",bird:"小鸟",panda:"小熊猫",penguin:"小企鹅"};
const M={hungry:["肚子饿了...","想吃东西~","好饿啊"],tired:["好困...","想睡觉","打哈欠"],sad:["不开心...","陪我玩","有点无聊"],happy:["好开心！","喜欢你！","真快乐~"]};
function load(){const s=localStorage.getItem("pets9");if(s)pets=JSON.parse(s);render()}
function save(){localStorage.setItem("pets9",JSON.stringify(pets))}
function gid(id){return document.getElementById(id)}
function showPanel(){gid("panel").classList.add("show")}
function hidePanel(){gid("panel").classList.remove("show")}
function showFood(id){curId=id;gid("foodPanel").classList.add("show")}
function hideFood(){gid("foodPanel").classList.remove("show");curId=null}
function hatch(type){hidePanel();const p={id:Date.now().toString(36)+Math.random().toString(36).substr(2),type,name:N[type],level:1,exp:0,hunger:80,happy:80,energy:100,sleeping:false};pets.push(p);save();render();toast("恭喜获得 "+N[type]+"！")}
function feed(food){hideFood();if(!curId)return;const p=pets.find(x=>x.id===curId);if(!p)return;const e={apple:15,carrot:12,fish:20,cake:25};p.hunger=Math.min(100,p.hunger+(e[food]||10));p.happy=Math.min(100,p.happy+3);p.exp+=10;checkLv(p);save();render();toast(p.name+" 吃了食物！")}
function play(id){const p=pets.find(x=>x.id===id);if(!p)return;if(p.sleeping){toast(p.name+" 在睡觉...");return}if(p.energy<20){toast(p.name+" 太累了！");return}p.energy=Math.max(0,p.energy-10);p.happy=Math.min(100,p.happy+15);p.hunger=Math.max(0,p.hunger-5);p.exp+=15;checkLv(p);save();render();const av=gid("av"+id);if(av){av.classList.add("happy");setTimeout(()=>av.classList.remove("happy"),600)}toast(p.name+" 玩得很开心！")
}
function sleep(id){const p=pets.find(x=>x.id===id);if(!p)return;p.sleeping=!p.sleeping;if(p.sleeping){p.energy=100;toast(p.name+" 开始睡觉... Zzz")}else{toast(p.name+" 睡醒啦！")}save();render()}
function edit(id){const p=pets.find(x=>x.id===id);if(!p)return;const inp=gid("inp"+id);if(inp.style.display==="none"){inp.style.display="block";inp.value=p.name;inp.focus()}else{if(inp.value.trim())p.name=inp.value.trim();save()}inp.style.display="none";render()}
function checkLv(p){const need=p.level*100;while(p.exp>=need){p.exp-=need;p.level++;toast(p.name+" 升级了！Lv."+p.level+"！")}}
function getSt(p){if(p.sleeping)return{text:"💤 睡觉中...",cls:""};if(p.hunger<30)return{text:"😫 "+M.hungry[Math.floor(Math.random()*3)],cls:"hungry"};if(p.energy<30)return{text:"😴 "+M.tired[Math.floor(Math.random()*3)],cls:"tired"};if(p.happy<30)return{text:"😢 "+M.sad[Math.floor(Math.random()*3)],cls:"sad"};return{text:"😊 "+M.happy[Math.floor(Math.random()*3)],cls:"happy"}}
function ava(t){switch(t){case"crayfish":return'<div class="pc-body"></div><div class="pc-eye left"></div><div class="pc-eye right"></div><div class="pc-ant left"></div><div class="pc-ant right"></div><div class="pc-claw left"></div><div class="pc-claw right"></div><div class="pc-tail"></div>';case"cat":return'<div class="pca-body"></div><div class="pca-head"></div><div class="pca-ear left"></div><div class="pca-ear right"></div><div class="pca-eye left"></div><div class="pca-eye right"></div><div class="pca-nose"></div><div class="pca-tail"></div>';case"dog":return'<div class="pd-body"></div><div class="pd-head"></div><div class="pd-eye left"></div><div class="pd-eye right"></div><div class="pd-nose"></div><div class="pd-tongue"></div><div class="pd-tail"></div>';case"rabbit":return'<div class="pr-body"></div><div class="pr-head"></div><div class="pr-ear left"></div><div class="pr-ear right"></div><div class="pr-eye left"></div><div class="pr-eye right"></div><div class="pr-tail"></div>';case"bird":return'<div class="pb-body"></div><div class="pb-head"></div><div class="pb-eye left"></div><div class="pb-eye right"></div><div class="pb-beak"></div><div class="pb-wing"></div>';case"panda":return'<div class="pp-body"></div><div class="pp-head"></div><div class="pp-ear left"></div><div class="pp-ear right"></div><div class="pp-patch left"></div><div class="pp-patch right"></div><div class="pp-eye left"></div><div class="pp-eye right"></div>';case"penguin":return'<div class="ppe-body"></div><div class="ppe-belly"></div><div class="ppe-head"></div><div class="ppe-eye left"></div><div class="ppe-eye right"></div><div class="ppe-beak"></div><div class="ppe-wing left"></div><div class="ppe-wing right"></div><div class="ppe-foot left"></div><div class="ppe-foot right"></div>';default:return""}}
function render(){gid("count").textContent=pets.length;const c=gid("pets");if(pets.length===0){c.innerHTML="<div class=empty><div class=icon>🥚</div><h2>还没有宠物~</h2><p>快来领养一只吧！</p><button class=new-egg-btn onclick=showPanel()>领养宠物</button></div>";return}c.innerHTML=pets.map(function(p){var s=getSt(p);var h='<div class=card><div class=card-header><div class=name>'+p.name+'<span onclick=edit("'+p.id+'") style="cursor:pointer;font-size:12px;opacity:0.5;margin-left:5px">✏️</span></div><div class=level>Lv.'+p.level+'</div></div><div class=avatar id=av'+p.id+' onclick=play("'+p.id+'")>'+ava(p.type)+'</div><div class=stats><div class=stat><span class=stat-icon>🍖</span><div class=stat-bar><div class=bar hunger style=width:'+p.hunger+'%></div></div><span class=stat-value>'+p.hunger+'</span></div><div class=stat><span class=stat-icon>😊</span><div class=stat-bar><div class=bar happy style=width:'+p.happy+'%></div></div><span class=stat-value>'+p.happy+'</span></div><div class=stat><span class=stat-icon>⚡</span><div class=stat-bar><div class=bar energy style=width:'+p.energy+'%></div></div><span class=stat-value>'+p.energy+'</span></div></div><div class=status '+s.cls+'>'+s.text+'</div><div class=actions><button class="action feed" onclick=showFood("'+p.id+'")>🍖<span>喂食</span></button><button class="action play" onclick=play("'+p.id+'")>🎮<span>玩耍</span></button><button class="action sleep" onclick=sleep("'+p.id+'")>'+(p.sleeping?"☀️":"😴")+'<span>'+(p.sleeping?"唤醒":"睡觉")+'</span></button></div></div>';return h}).join("")}
function toast(msg){const t=gid("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}load()
</script>
</body>
</html>
