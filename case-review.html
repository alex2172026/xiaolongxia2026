<script>
(function(){
var pets=[];
var currentPetId=null;
var N={rat:"小老鼠",ox:"小牛牛",tiger:"小老虎",rabbit:"小兔兔",dragon:"小龙龙",snake:"小蛇蛇",horse:"小马马",goat:"小羊羊",monkey:"小猴猴",rooster:"小鸡鸡",dog:"小狗狗",pig:"小猪猪"};
var M={hungry:["肚子饿了...","想吃东西~","好饿啊"],tired:["好困...","想睡觉","打哈欠"],sad:["不开心...","陪我玩","有点无聊"],happy:["好开心！","喜欢你！","真快乐~"]};
var E={apple:15,carrot:12,fish:20,cake:25};

function load(){var s=localStorage.getItem("zodiac12");if(s)pets=JSON.parse(s);render()}
function save(){localStorage.setItem("zodiac12",JSON.stringify(pets))}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2500)}

function showAdoptPanel(){document.getElementById("adoptPanel").classList.add("active")}
function hideAdoptPanel(){document.getElementById("adoptPanel").classList.remove("active")}
function showFeedPanel(id){currentPetId=id;document.getElementById("feedPanel").classList.add("active")}
function hideFeedPanel(){document.getElementById("feedPanel").classList.remove("active");currentPetId=null}

document.getElementById("adoptBtn").onclick=showAdoptPanel;
document.getElementById("closeAdopt").onclick=hideAdoptPanel;
document.getElementById("closeFeed").onclick=hideFeedPanel;

document.getElementById("adoptPanel").onclick=function(e){if(e.target===this)hideAdoptPanel()};
document.getElementById("feedPanel").onclick=function(e){if(e.target===this)hideFeedPanel()};

var adoptItems=document.querySelectorAll("#adoptPanel .item");
for(var i=0;i<adoptItems.length;i++){
adoptItems[i].onclick=function(){hatch(this.getAttribute("data-type"))}
}

var feedItems=document.querySelectorAll("#feedPanel .item");
for(var i=0;i<feedItems.length;i++){
feedItems[i].onclick=function(){feed(this.getAttribute("data-food"))}
}

function hatch(type){hideAdoptPanel();var p={id:Date.now().toString(36)+Math.random().toString(36).substr(2),type:type,name:N[type],level:1,exp:0,hunger:80,happy:80,energy:100,sleeping:false};pets.push(p);save();render();toast("恭喜获得 "+N[type]+"！")}

function feed(food){if(!currentPetId)return;var p=null;for(var i=0;i<pets.length;i++){if(pets[i].id===currentPetId){p=pets[i];break}}if(!p){hideFeedPanel();return}p.hunger=Math.min(100,p.hunger+(E[food]||10));p.happy=Math.min(100,p.happy+3);p.exp+=10;checkLv(p);save();render();hideFeedPanel();toast(p.name+" 吃了食物！")}

function play(id){var p=null;for(var i=0;i<pets.length;i++){if(pets[i].id===id){p=pets[i];break}}if(!p)return;if(p.sleeping){toast(p.name+" 在睡觉...");return}if(p.energy<20){toast(p.name+" 太累了！");return}p.energy=Math.max(0,p.energy-10);p.happy=Math.min(100,p.happy+15);p.hunger=Math.max(0,p.hunger-5);p.exp+=15;checkLv(p);save();render();var av=document.getElementById("av"+id);if(av){av.classList.add("happy");setTimeout(function(){av.classList.remove("happy")},700)}toast(p.name+" 玩得很开心！")}

function sleep(id){var p=null;for(var i=0;i<pets.length;i++){if(pets[i].id===id){p=pets[i];break}}if(!p)return;p.sleeping=!p.sleeping;if(p.sleeping){p.energy=100;toast(p.name+" 开始睡觉... Zzz")}else{toast(p.name+" 睡醒啦！")}save();render()}

function checkLv(p){var need=p.level*100;while(p.exp>=need){p.exp-=need;p.level++;toast(p.name+" 升级了！Lv."+p.level+"！")}}

function getSt(p){if(p.sleeping)return{text:"💤 睡觉中...",cls:""};if(p.hunger<30)return{text:"😫 "+M.hungry[Math.floor(Math.random()*3)],cls:"hungry"};if(p.energy<30)return{text:"😴 "+M.tired[Math.floor(Math.random()*3)],cls:"tired"};if(p.happy<30)return{text:"😢 "+M.sad[Math.floor(Math.random()*3)],cls:"sad"};return{text:"😊 "+M.happy[Math.floor(Math.random()*3)],cls:"happy"}}

function ava(t){var faces={rat:'<div class="rat-face"></div><div class="rat-ear left"></div><div class="rat-ear right"></div><div class="rat-eye left"></div><div class="rat-eye right"></div><div class="rat-nose"></div>',ox:'<div class="ox-face"></div><div class="ox-horn left"></div><div class="ox-horn right"></div><div class="ox-eye left"></div><div class="ox-eye right"></div>',tiger:'<div class="tiger-face"></div><div class="tiger-stripe s1"></div><div class="tiger-stripe s2"></div><div class="tiger-stripe s3"></div><div class="tiger-stripe s4"></div><div class="tiger-eye left"></div><div class="tiger-eye right"></div>',rabbit:'<div class="rabbit-face"></div><div class="rabbit-ear"></div><div class="rabbit-ear right"></div><div class="rabbit-eye left"></div><div class="rabbit-eye right"></div>',dragon:'<div class="dragon-face"></div><div class="dragon-horn left"></div><div class="dragon-horn right"></div><div class="dragon-eye left"></div><div class="dragon-eye right"></div>',snake:'<div class="snake-body"></div><div class="snake-eye left"></div><div class="snake-eye right"></div>',horse:'<div class="horse-face"></div><div class="horse-mane"></div><div class="horse-eye left"></div><div class="horse-eye right"></div>',goat:'<div class="goat-face"></div><div class="goat-horn left"></div><div class="goat-horn right"></div><div class="goat-eye left"></div><div class="goat-eye right"></div>',monkey:'<div class="monkey-face"></div><div class="monkey-ear left"></div><div class="monkey-ear right"></div><div class="monkey-eye left"></div><div class="monkey-eye right"></div>',rooster:'<div class="rooster-face"></div><div class="rooster-comb"></div><div class="rooster-eye left"></div><div class="rooster-eye right"></div>',dog:'<div class="dog-face"></div><div class="dog-ear"></div><div class="dog-ear right"></div><div class="dog-eye left"></div><div class="dog-eye right"></div>',pig:'<div class="pig-face"></div><div class="pig-snout"></div>'};return faces[t]||""}

function render(){document.getElementById("count").textContent=pets.length;var c=document.getElementById("petsContainer");if(pets.length===0){c.innerHTML='<div class="empty"><div class="ic">🐾</div><h2>还没有生肖宠物~</h2><p>快来领养一只守护神吧！</p><button class="new-btn" id="emptyAdoptBtn">领养生肖宠物</button></div>';document.getElementById("emptyAdoptBtn").onclick=showAdoptPanel;return}var html="";for(var i=0;i<pets.length;i++){var p=pets[i];var s=getSt(p);html+='<div class="card"><div class="card-header"><div class="name">'+p.name+'</div><div class="level">Lv.'+p.level+'</div></div><div class="avatar-wrap"><div class="avatar" id="av'+p.id+'">'+ava(p.type)+'</div></div><div class="stats"><div class="stat"><span class="stat-icon">🍖</span><div class="stat-bar"><div class="bar hunger" style="width:'+p.hunger+'%"></div></div><span class="stat-val">'+p.hunger+'</span></div><div class="stat"><span class="stat-icon">😊</span><div class="stat-bar"><div class="bar happy" style="width:'+p.happy+'%"></div></div><span class="stat-val">'+p.happy+'</span></div><div class="stat"><span class="stat-icon">⚡</span><div class="stat-bar"><divbar energy" style="width:'+p.energy+'%"></div></div><span class="stat-val">'+p.energy+'</span></div></div><div class="status '+s.cls+'">'+s.text+'</div><div class="actions"><button class="btn feed" data-action="feed" data-id="'+p.id+'">🍖<span>喂食</span></button><button class="btn play" data-action="play" data-id="'+p.id+'">🎮<span>玩耍</span></button><button class="btn sleep" data-action="sleep" data-id="'+p.id+'">'+(p.sleeping?'☀️':'😴')+'<span>'+(p.sleeping?'唤醒':'睡觉')+'</span></button></div></div>'}c.innerHTML=html;var btns=document.querySelectorAll('.btn[data-action]');for(var j=0;j<btns.length;j++){btns[j].onclick=function(){var a=this.getAttribute('data-action');var id=this.getAttribute('data-id');if(a==='feed')showFeedPanel(id);else if(a==='play')play(id);else if(a==='sleep')sleep(id)}}}load()})()
</script>
</body>
