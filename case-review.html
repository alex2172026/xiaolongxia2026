.rooster-eye::after{content:"";position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;top:2px;left:2px}
.rooster-beak{position:absolute;width:0;height:0;border-top:12px solid #ffa500;border-left:10px solid transparent;border-right:10px solid transparent;top:40px;left:50%;transform:translateX(-50%)}
.rooster-wattle{position:absolute;width:14px;height:20px;background:linear-gradient(145deg,#dc143c,#b22222);border-radius:50%;top:58px;left:50%;transform:translateX(-50%)}
.rooster-ear{position:absolute;width:20px;height:15px;background:#ff6347;border-radius:50%;top:28px}
.rooster-ear.left{left:5px}
.rooster-ear.right{right:5px}
/* 3D Dog */
.dog-face{position:absolute;width:95px;height:85px;background:linear-gradient(145deg,#c4a67c,#a68b5b);border-radius:50% 50% 45% 45%;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:inset -10px -10px 25px rgba(0,0,0,0.3),inset 6px 6px 18px rgba(255,220,180,0.2)}
.dog-ear{position:absolute;width:32px;height:40px;background:linear-gradient(145deg,#a68b5b,#8b7355);border-radius:50% 50% 40% 40%;top:8px}
.dog-ear.left{left:2px;transform:rotate(-20deg)}
.dog-ear.right{right:2px;transform:rotate(20deg)}
.dog-eye{position:absolute;width:18px;height:20px;background:#1a1a2e;border-radius:50%;top:28px;box-shadow:inset 3px 3px 8px rgba(255,255,255,0.2)}
.dog-eye.left{left:22px}
.dog-eye.right{right:22px}
.dog-eye::after{content:"";position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;top:3px;left:3px}
.dog-nose{position:absolute;width:20px;height:16px;background:#1a1a2e;border-radius:50% 50% 40% 40%;top:50px;left:50%;transform:translateX(-50%)}
.dog-tongue{position:absolute;width:14px;height:20px;background:linear-gradient(180deg,#ff6b6b,#ff4757);border-radius:0 0 50% 50%;top:65px;left:50%;transform:translateX(-50%)}
.dog-tail{position:absolute;width:15px;height:45px;background:linear-gradient(180deg,#c4a67c,#a68b5b);border-radius:10px;right:0;top:35px;transform-origin:bottom center;animation:walk 0.5s ease-in-out infinite}
/* 3D Pig */
.pig-face{position:absolute;width:100px;height:88px;background:linear-gradient(145deg,#ffb6c1,#ff9aa2);border-radius:50% 50% 48% 48%;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:inset -10px -10px 25px rgba(0,0,0,0.2),inset 6px 6px 18px rgba(255,200,210(0.3)}.pig-ear{position:absolute;width:32px;height:35px;background:linear-gradient(145deg,#ffb6c1,#ff9aa2);border-radius:50%;top:5px}
.pig-ear.left{left:8px;transform:rotate(-15deg)}
.pig-ear.right{right:8px;transform:rotate(15deg)}
.pig-eye{position:absolute;width:16px;height:18px;background:#1a1a2e;border-radius:50%;top:28px}
.pig-eye.left{left:25px}
.pig-eye.right{right:25px}
.pig-eye::after{content:"";position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;top:3px;left:3px}
.pig-snout{position:absolute;width:45px;height:32px;background:linear-gradient(145deg,#ff9aa2,#ff8099);border-radius:50%;top:48px;left:50%;transform:translateX(-50%);box-shadow:inset -5px -5px 12px rgba(0,0,0,0.15)}
.pig-nostril{position:absolute;width:10px;height:12px;background:#cc7080;border-radius:50%;top:8px}
.pig-nostril.left{left:8px}
.pig-nostril.right{right:8px}
.pig-blush{position:absolute;width:20px;height:12px;background:rgba(255,150,180,0.4);border-radius:50%;top:40px}
.pig-blush.left{left:10px}
.pig-blush.right{right:10px}
.panel{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(8px)}
.panel.show{display:flex;animation:fadeIn 0.3s}
.modal{background:linear-gradient(145deg,rgba(40,40,60,0.98),rgba(30,30,50,0.98));backdrop-filter:blur(20px);border-radius:28px;padding:28px;max-width:500px;width:90%;max-height:85vh;overflow-y:auto;animation:slideDown 0.4s;position:relative;border:1px solid rgba(255,255,255,0.1)}
.modal h2{text-align:center;color:#ffd700;margin-bottom:22px;font-size:1.6em;text-shadow:0 0 15px rgba(255,215,0,0.5)}
.modal h3{text-align:center;color:#ffd700;margin-bottom:18px;font-size:1.3em}
.close{position:absolute;top:12px;right:12px;width:34px;height:34px;background:rgba(255,255,255,0.1);border:none;border-radius:50%;color:#fff;font-size:18px;cursor:pointer;transition:all 0.3s}
.close:hover{background:rgba(255,255,255,0.2);transform:rotate(90deg)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.item{background:rgba(255,255,255,0.08);border-radius:18px;padding:18px 8px;text-align:center;cursor:pointer;transition:all 0.3s;border:2px solid transparent}
.item:hover{border-color:#ffd700;transform:translateY(-8px) scale(1.05);background:rgba(255,215,0,0.15);box-shadow:0 15px 35px rgba(0,0,0,0.4)}
.item:hover .ic{transform:scale(1.25) rotateY(20deg)}
.ic{font-size:45px;display:block;margin-bottom:8px;transition:transform 0.4s;filter:drop-shadow(0 5px 10px rgba(0,0,0,0.3))}
.iname{font-size:13px;font-weight:600;color:#fff;margin-top:5px}
.ieff{font-size:10px;color:rgba(255,255,255,0.6);margin-top:2px}
.toast{position:fixed;bottom:35px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a1a2e;padding:14px 30px;border-radius:25px;font-size:15px;font-weight:700;opacity:0;z-index:2000;box-shadow:0 8px 25px rgba(255,215,0,0.5);transition:opacity 0.3s}
.toast.show{opacity:1;animation:slideDown 0.5s}
.empty{text-align:center;padding:70px 20px}
.empty .ic{font-size:100px;margin-bottom:20px;animation:pulse 2s infinite}
.empty h2{color:#ffd700;margin-bottom:12px;font-size:1.8em}
.empty p{color:rgba(255,255,255,0.7);margin-bottom:25px}
@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.h1{font-size:1.6em}}
</style>
</head>
<body>
<div class=container>
<h1>我的宠物乐园 - 12生肖</h1>
<div class=header>
<div class=stats-bar>宠物: <span id=count>0</span>只</div>
<button class=new-btn onclick=showPanel()>领养生肖宠物</button>
</div>
<div class=pets id=pets></div>
</div>

<div class=panel id=panel onclick="if(event.target===this)hidePanel()">
<div class=modal>
<button class=close onclick=hidePanel()>X</button>
<h2>选择你的生肖守护神</h2>
<div class=grid>
<div class=item onclick=hatch("rat")><span class=ic>🐀</span><div class=iname>鼠</div></div>
<div class=item onclick=hatch("ox")><span class=ic>🐂</span><div class=iname>牛</div></div>
<div class=item onclick=hatch("tiger")><span class=ic>🐅</span><div class=iname>虎</div></div>
<div class=item onclick=hatch("rabbit")><span class=ic>🐇</span><div class=iname>兔</div></div>
<div class=item onclick=hatch("dragon")><span class=ic>🐉</span><div class=iname>龙</div></div>
<div class=item onclick=hatch("snake")><span class=ic>🐍</span><div class=iname>蛇</div></div>
<div class=item onclick=hatch("horse")><span class=ic>🐎</span><div class=iname>马</div></div>
<div class=item onclick=hatch("goat")><span class=ic>🐐</span><div class=iname>羊</div></div>
<div class=item onclick=hatch("monkey")><span class=ic>🐒</span><div class=iname>猴</div></div>
<div class=item onclick=hatch("rooster")><span class=ic>🐓</span><div class=iname>鸡</div></div>
<div class=item onclick=hatch("dog")><span class=ic>🐕</span><div class=iname>狗</div></div>
<div class=item onclick=hatch("pig")><span class=ic>🐖</span><div class=iname>猪</div></div>
</div>
</div>
</div>

<div class=panel id=foodPanel onclick="if(event.target===this)hideFood()">
<div class=modal>
<button class=close onclick=hideFood()>X</button>
<h3>喂食</h3>
<div class=grid>
<div class=item onclick=feed("apple")><span class=ic>🍎</span><div class=iname>苹果</div><div class=ieff>+15饱食</div></div>
<div class=item onclick=feed("carrot")><span class=ic>🥕</span><div class=iname>胡萝卜</div><div class=ieff>+12饱食</div></div>
<div class=item onclick=feed("fish")><span class=ic>🐟</span><div class=iname>小鱼干</div><div class=ieff>+20饱食</div></div>
<div class=item onclick=feed("cake")><span class=ic>🍰</span><div class=iname>小蛋糕</div><div class=ieff>+25饱食</div></div>
</div>
</div>
</div>

<div class=toast id=toast></div>

<script>
var pets=[];
var curId=null;
var N={rat:"小老鼠",ox:"小牛牛",tiger:"小老虎",rabbit:"小兔兔",dragon:"小龙龙",snake:"小蛇蛇",horse:"小马马",goat:"小羊羊",monkey:"小猴猴",rooster:"小鸡鸡",dog:"小狗狗",pig:"小猪猪"};
var M={hungry:["肚子饿了...","想吃东西~","好饿啊"],tired:["好困...","想睡觉","打哈欠"],sad:["不开心...","陪我玩","有点无聊"],happy:["好开心！","喜欢你！","真快乐~"]};

function load(){var s=localStorage.getItem("zodiac12");if(s)pets=JSON.parse(s);render()}
function save(){localStorage.setItem("zodiac12",JSON.stringify(pets))}
function gid(id){return document.getElementById(id)}
function showPanel(){gid("panel").classList.add("show")}
function hidePanel(){gid("panel").classList.remove("show")}
function showFood(id){curId=id;gid("foodPanel").classList.add("show")}
function hideFood(){gid("foodPanel").classList.remove("show");curId=null}

function hatch(type){hidePanel();var p={id:Date.now().toString(36)+Math.random().toString(36).substr(2),type:type,name:N[type],level:1,exp:0,hunger:80,happy:80,energy:100,sleeping:false};pets.push(p);save();render();toast("恭喜获得 "+N[type]+"！")}

function feed(food){hideFood();if(!curId)return;var p=pets.find(function(x){return x.id===curId});if(!p)return;var e={apple:15,carrot:12,fish:20,cake:25};p.hunger=Math.min(100,p.hunger+(e[food]||10));p.happy=Math.min(100,p.happy+3);p.exp+=10;checkLv(p);save();render();toast(p.name+" 吃了食物！")}

function play(id){var p=pets.find(function(x){return x.id===id});if(!p)return;if(p.sleeping){toast(p.name+" 在睡觉...");return}if(p.energy<20){toast(p.name+" 太累了！");return}p.energy=Math.max(0,p.energy-10);p.happy=Math.min(100,p.happy+15);p.hunger=Math.max(0,p.hunger-5);p.exp+=15;checkLv(p);save();render();var av=gid("av"+id);if(av){av.classList.add("happy");setTimeout(function(){av.classList.remove("happy")},700)}toast(p.name+" 玩得很开心！")}

function sleep(id){var p=pets.find(function(x){return x.id===id});if(!p)return;p.sleeping=!p.sleeping;if(p.sleeping){p.energy=100;toast(p.name+" 开始睡觉... Zzz")}else{toast(p.name+" 睡醒啦！")}save();render()}

function edit(id){var p=pets.find(function(x){return x.id===id});if(!p)return;var inp=gid("inp"+id);if(inp.style.display==="none"){inp.style.display="block";inp.value=p.name;inp.focus()}else{if(inp.value.trim())p.name=inp.value.trim();save()}inp.style.display="none";render()}

function checkLv(p){var need=p.level*100;while(p.exp>=need){p.exp-=need;p.level++;toast(p.name+" 升级了！Lv."+p.level+"！")}}

function getSt(p){if(p.sleeping)return{text:"💤 睡觉中...",cls:""};if(p.hunger<30)return{text:"😫 "+M.hungry[Math.floor(Math.random()*3)],cls:"hungry"};if(p.energy<30)return{text:"😴 "+M.tired[Math.floor(Math.random()*3)],cls:"tired"};if(p.happy<30)return{text:"😢 "+M.sad[Math.floor(Math.random()*3)],cls:"sad"};return{text:"😊 "+M.happy[Math.floor(Math.random()*3)],cls:"happy"}}

function ava(t){switch(t){case"rat":return'<div class="rat-face"></div><div class="rat-ear left"></div><div class="rat-ear right"></div><div class="rat-eye left"></div><div class="rat-eye right"></div><div class="rat-nose"></div><div class="rat-whisker l1"></div><div class="rat-whisker l2"></div><div class="rat-whisker r1"></div><div class="rat-whisker r2"></div><div class="rat-tail"></div>';case"ox":return'<div class="ox-face"></div><div class="ox-horn left"></div><div class="ox-horn right"></div><div class="ox-eye left"></div><div class="ox-eye right"></div><div class="ox-ear left"></div><div class="ox-ear right"></div><div class="ox-nose"><div class="ox-nostril left"></div><div class="ox-nostril right"></div></div>';case"tiger":return'<div class="tiger-face"></div><div class="tiger-stripe s1"></div><div class="tiger-stripe s2"></div><div class="tiger-stripe s3"></div><div class="tiger-stripe s4"></div><div class="tiger-ear left"></div><div class="tiger-ear right"></div><div class="tiger-eye left"></div><div class="tiger-eye right"></div><div class="tiger-nose"></div><div class="tiger-mouth"></div><div class="tiger-whisker l1"></div><div class="tiger-whisker r1"></div>';case"rabbit":return'<div class="rabbit-face"></div><div class="rabbit-ear left"></div><div class="rabbit-ear right"></div><div class="rabbit-eye left"></div><div class="rabbit-eye right"></div><div class="rabbit-blush left"></div><div class="rabbit-blush right"></div><div class="rabbit-nose"></div><div class="rabbit-mouth"></div><div class="rabbit-tail"></div>';case"dragon":return'<div class="dragon-face"></div><div class="dragon-horn left"></div><div class="dragon-horn right"></div><div class="dragon-eye left"></div><div class="dragon-eye right"></div><div class="dragon-nostril left"></div><div class="dragon-nostril right"></div><div class="dragon-mouth"><div class="dragon-tooth l"></div><div class="dragon-tooth r"></div></div><div class="dragon-whisker l"></div><div class="dragon-whisker r"></div>';case"snake":return'<div class="snake-body"></div><div class="snake-eye left"></div><div class="snake-eye right"></div><div class="snake-scale s1"></div><div class="snake-scale s2"></div><div class="snake-scale s3"></div><div class="snake-tongue"></div>';case"horse":return'<div class="horse-face"></div><div class="horse-mane"></div><div class="horse-ear left"></div><div class="horse-ear right"></div><div class="horse-eye left"></div><div class="horse-eye right"></div><div class="horse-nose"><div class="horse-nostril left"></div><div class="horse-nostril right"></div></div>';case"goat":return'<div class="goat-face"></div><div class="goat-horn left"></div><div class="goat-horn right"></div><div class="goat-ear left"></div><div class="goat-ear right"></div><div class="goat-eye left"></div><div class="goat-eye right"></div><div class="goat-nose"></div><div class="goat-beard"></div>';case"monkey":return'<div class="monkey-face"></div><div class="monkey-ear left"></div><div class="monkey-ear right"></div><div class="monkey-eye left"></div><div class="monkey-eye right"></div><div class="monkey-nose"></div><div class="monkey-mouth"><div class="monkey-teeth l"></div><div class="monkey-teeth r"></div></div>';case"rooster":return'<div class="rooster-face"></div><div class="rooster-comb"></div><div class="rooster-eye left"></div><div class="rooster-eye right"></div><div class="rooster-ear left"></div><div class="rooster-ear right"></div><div class="rooster-beak"></div><div class="rooster-wattle"></div>';case"dog":return'<div class="dog-face"></div><div class="dog-ear left"></div><div class="dog-ear right"></div><div class="dog-eye left"></div><div class="dog-eye right"></div><div class="dog-nose"></div><div class="dog-tongue"></div><div class="dog-tail"></div>';case"pig":return'<div class="pig-face"></div><div class="pig-ear left"></div><div class="pig-ear right"></div><div class="pig-eye left"></div><div class="pig-eye right"></div><div class="pig-snout"><div class="pig-nostril left"></div><div class="pig-nostril right"></div></div><div class="pig-blush left"></div><div class="pig-blush right"></div>';default:return""}}

function render(){gid("count").textContent=pets.length;var c=gid("pets");if(pets.length===0){c.innerHTML='<div class=empty><div class=ic>🐾</div><h2>还没有生肖宠物~</h2><p>快来领养一只守护神吧！</p><button class=new-btn onclick=showPanel()>领养生肖宠物</button></div>';return}var html="";for(var i=0;i<pets.length;i++){var p=pets[i];var s=getSt(p);html+='<div class=card><div class=card-header><div class=name>'+p.name+'<span onclick="edit(\''+p.id+'\')">✏️</span></div><div class=level>Lv.'+p.level+'</div></div><div class=avatar-wrap><div class=avatar id=av'+p.id+' onclick="play(\''+p.id+'\')">'+ava(p.type)+'</div></div><input type=text id=inp'+p.id+' style="display:none;width:80%;padding:6px;border:1px solid #555;border-radius:8px;background:rgba(255,255,255,0.1);color:#fff" onblur="edit(\''+p.id+'\')"><div class=stats><div class=stat><span class=stat-icon>🍖</span><div class=stat-bar><div class="bar hunger" style="width:'+p.hunger+'%"></div></div><span class=stat-val>'+p.hunger+'</span></div><div class=stat><span class=stat-icon>😊</span><div class=stat-bar><div class="bar happy" style="width:'+p.happy+'%"></div></div><span class=stat-val>'+p.happy+'</span></div><div class=stat><span class=stat-icon>⚡</span><div class=stat-bar><div class="bar energy" style="width:'+p.energy+'%"></div></div><span class=stat-val>'+p.energy+'</span></div></div><div class="status '+s.cls+'">'+s.text+'</div><div class=actions><button class="btn feed" onclick="showFood(\''+p.id+'\')">🍖<span>喂食</span></button><button class="btn play" onclick="play(\''+p.id+'\')">🎮<span>玩耍</span></button><button class="btn sleep" onclick="sleep(\''+p.id+'\')">'+(p.sleeping?"☀️":"😴")+'<span>'+(p.sleeping?"唤醒":"睡觉")+'</span></button></div></div>'}c.innerHTML=html}

function toast(msg){var t=gid("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2500)}

load()
</script>
</body>
</html>
