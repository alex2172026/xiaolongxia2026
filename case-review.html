<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠物乐园 - 12生肖</title>
<style>
*{margin:0;padding:0}
body{font-family:Nunito,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;padding:15px}
.auth-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:center;z-index:2000}
.auth-box{background:rgba(255,255,255,0.1);padding:40px;border-radius:20px;text-align:center;width:320px}
.auth-tabs{display:flex;margin-bottom:20px}
.auth-tab{flex:1;padding:10px;background:none;border:none;color:rgba(255,255,255,0.6);cursor:pointer;border-radius:10px}
.auth-tab.active{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a1a2e}
.auth-form{display:none}
.auth-form.active{display:block}
.auth-form input{width:100%;padding:12px;margin-bottom:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff}
.auth-form button{width:100%;padding:12px;background:linear-gradient(135deg,#ffd700,#ff8c00);border:none;border-radius:8px;color:#1a1a2e;font-weight:bold;cursor:pointer}
.main-app{display:none}
.main-app.show{display:block}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
h1{color:#ffd700;text-align:center;margin-bottom:15px}
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pet-avatar-img{width:120px;height:120px;border-radius:50%;object-fit:cover;margin:10px auto;display:block;box-shadow:0 5px 20px rgba(0,0,0,0.3)}
.card{background:rgba(255,255,255,0.1);padding:15px;border-radius:15px}
.card-top{display:flex;justify-content:space-between;margin-bottom:10px}
.name{color:#fff;font-weight:bold}
.level{background:#ffd700;color:#1a1a2e;padding:3px 8px;border-radius:10px;font-size:12px}
.stats{display:flex;gap:5px;margin:10px 0}
.stat{flex:1;text-align:center;color:rgba(255,255,255,0.8);font-size:12px}
.actions{display:flex;gap:5px;margin-top:10px}
.btn{flex:1;padding:8px;background:rgba(255,255,255,0.2);border:none;border-radius:8px;color:#fff;cursor:pointer}
.btn.feed{background:linear-gradient(135deg,#f093fb,#f5576c)}
.btn.play{background:linear-gradient(135deg,#4fd1c5,#38b2ac)}
.btn.sleep{background:linear-gradient(135deg,#667eea,#764ba2)}
.panel{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:1000}
.panel.active{display:flex}
.modal{background:#2d2d4d;padding:25px;border-radius:15px;width:90%;max-width:400px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:rgba(255,255,255,0.1);padding:15px;border-radius:10px;text-align:center;cursor:pointer}
.item:hover{background:rgba(255,215,0,0.3)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ffd700;color:#1a1a2e;padding:12px 24px;border-radius:20px;font-weight:bold;opacity:0;transition:opacity 0.3s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="authScreen" class="auth-screen">
<div class="auth-box">
<h2 style="color:#ffd700;margin-bottom:10px">宠物乐园</h2>
<p style="color:rgba(255,255,255,0.7);margin-bottom:20px">12生肖宠物养成</p>
<div class="auth-tabs">
<button class="auth-tab active" onclick="switchTab('login')">登录</button>
<button class="auth-tab" onclick="switchTab('register')">注册</button>
</div>
<form id="loginForm" class="auth-form active">
<input type="text" id="loginUser" placeholder="用户名" required>
<input type="password" id="loginPass" placeholder="密码" required>
<button type="submit">登录</button>
</form>
<form id="registerForm" class="auth-form">
<input type="text" id="regUser" placeholder="用户名(3-12位)" required>
<input type="password" id="regPass" placeholder="密码(6位以上)" required>
<input type="password" id="regPass2" placeholder="确认密码" required>
<button type="submit">注册</button>
</form>
</div>
</div>

<div id="mainApp" class="main-app">
<h1>🐾 宠物乐园 - 12生肖</h1>
<div class="header">
<div style="color:#fff">欢迎, <span id="userName">用户</span> <button onclick="logout()" style="background:rgba(255,100,100,0.3);border:none;color:#ff8888;padding:5px 10px;border-radius:5px;cursor:pointer">退出</button></div>
<div>宠物: <span id="count">0</span>只 <button onclick="showAdopt()" style="background:linear-gradient(135deg,#ffd700,#ff8c00);border:none;padding:8px 16px;border-radius:15px;cursor:pointer">领养</button></div>
</div>
<div id="petsContainer" class="pets"></div>
</div>

<div id="adoptPanel" class="panel">
<div class="modal">
<h3 style="color:#ffd700;margin-bottom:15px">选择生肖</h3>
<div class="grid">
<div class="item" onclick="hatch('rat')"><div style="font-size:30px">🐀</div><div style="color:#fff;font-size:12px">鼠</div></div>
<div class="item" onclick="hatch('ox')"><div style="font-size:30px">🐂</div><div style="color:#fff;font-size:12px">牛</div></div>
<div class="item" onclick="hatch('tiger')"><div style="font-size:30px">🐅</div><div style="color:#fff;font-size:12px">虎</div></div>
<div class="item" onclick="hatch('rabbit')"><div style="font-size:30px">🐇</div><div style="color:#fff;font-size:12px">兔</div></div>
<div class="item" onclick="hatch('dragon')"><div style="font-size:30px">🐉</div><div style="color:#fff;font-size:12px">龙</div></div>
<div class="item" onclick="hatch('snake')"><div style="font-size:30px">🐍</div><div style="color:#fff;font-size:12px">蛇</div></div>
<div class="item" onclick="hatch('horse')"><div style="font-size:30px">🐎</div><div style="color:#fff;font-size:12px">马</div></div>
<div class="item" onclick="hatch('goat')"><div style="font-size:30px">🐐</div><div style="color:#fff;font-size:12px">羊</div></div>
<div class="item" onclick="hatch('monkey')"><div style="font-size:30px">🐒</div><div style="color:#fff;font-size:12px">猴</div></div>
<div class="item" onclick="hatch('rooster')"><div style="font-size:30px">🐓</div><div style="color:#fff;font-size:12px">鸡</div></div>
<div class="item" onclick="hatch('dog')"><div style="font-size:30px">🐕</div><div style="color:#fff;font-size:12px">狗</div></div>
<div class="item" onclick="hatch('pig')"><div style="font-size:30px">🐖</div><div style="color:#fff;font-size:12px">猪</div></div>
</div>
<button onclick="hideAdopt()" style="margin-top:15px;background:none;border:1px solid #fff;color:#fff;padding:8px 20px;border-radius:8px;cursor:pointer">关闭</button>
</div>
</div>

<div id="feedPanel" class="panel">
<div class="modal">
<h3 style="color:#ffd700;margin-bottom:15px">选择食物</h3>
<div class="grid">
<div class="item" onclick="feed('apple')"><div style="font-size:30px">🍎</div><div style="color:#fff;font-size:12px">苹果 +15</div></div>
<div class="item" onclick="feed('carrot')"><div style="font-size:30px">🥕</div><div style="color:#fff;font-size:12px">胡萝卜 +12</div></div>
<div class="item" onclick="feed('fish')"><div style="font-size:30px">🐟</div><div style="color:#fff;font-size:12px">小鱼干 +20</div></div>
<div class="item" onclick="feed('cake')"><div style="font-size:30px">🍰</div><div style="color:#fff;font-size:12px">蛋糕 +25</div></div>
</div>
<button onclick="hideFeed()" style="margin-top:15px;background:none;border:1px solid #fff;color:#fff;padding:8px 20px;border-radius:8px;cursor:pointer">关闭</button>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
var currentUser=null;
var pets=[];
var feedId=null;
var users={};
var N={rat:"小老鼠",ox:"小牛牛",tiger:"小老虎",rabbit:"小兔兔",dragon:"小龙龙",snake:"小蛇蛇",horse:"小马马",goat:"小羊羊",monkey:"小猴猴",rooster:"小鸡鸡",dog:"小狗狗",pig:"小猪猪"};
// 宠物类型对应的3D图片映射
var PET_AVATARS={
  rat:"rat-3d",
  ox:"ox-3d",
  tiger:"tiger-3d",
  rabbit:"rabbit-3d",
  dragon:"dragon-3d",
  snake:"snake-3d",
  horse:"horse-3d",
  goat:"goat-3d",
  monkey:"monkey-3d",
  rooster:"rooster-3d",
  dog:"dog-3d",
  pig:"pig-3d"
};
var E={apple:15,carrot:12,fish:20,cake:25};

function init(){
  var s=localStorage.getItem("petUsersV6");
  if(s){try{users=JSON.parse(s)}catch(e){users={}}}
  var u=localStorage.getItem("petCurrentUserV6");
  if(u){
    try{currentUser=JSON.parse(u);loadData()}catch(e){}
  }
  document.getElementById("loginForm").onsubmit=doLogin;
  document.getElementById("registerForm").onsubmit=doRegister;
  updateUI();
}

function saveUsers(){localStorage.setItem("petUsersV6",JSON.stringify(users))}
function saveCurrent(){localStorage.setItem("petCurrentUserV6",currentUser?JSON.stringify(currentUser):null)}
function loadData(){
  if(!currentUser)return;
  var k="petDataV6_"+currentUser.username;
  var s=localStorage.getItem(k);
  if(s){try{pets=JSON.parse(s)}catch(e){pets=[]}}
}
function saveData(){
  if(!currentUser)return;
  var k="petDataV6_"+currentUser.username;
  localStorage.setItem(k,JSON.stringify(pets));
}

function updateUI(){
  if(currentUser){
    document.getElementById("authScreen").style.display="none";
    document.getElementById("mainApp").classList.add("show");
    document.getElementById("userName").textContent=currentUser.username;
    render();
  }else{
    document.getElementById("authScreen").style.display="flex";
    document.getElementById("mainApp").classList.remove("show");
  }
}

function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(function(){t.classList.remove("show")},2500);
}

function hash(p){
  var h=0;
  for(var i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h=h&h}
  return "x"+Math.abs(h).toString(36);
}

function switchTab(t){
  document.getElementById("loginForm").classList.toggle("active",t==="login");
  document.getElementById("registerForm").classList.toggle("active",t==="register");
  document.querySelectorAll(".auth-tab")[0].classList.toggle("active",t==="login");
  document.querySelectorAll(".auth-tab")[1].classList.toggle("active",t==="register");
}

function doLogin(e){
  e.preventDefault();
  var u=document.getElementById("loginUser").value.trim();
  var p=document.getElementById("loginPass").value;
  if(!u||!p){toast("请填写完整");return}
  if(!users[u]||users[u].password!==hash(p)){toast("用户名或密码错误");return}
  currentUser={username:u};
  saveCurrent();
  loadData();
  updateUI();
  toast("欢迎回来，"+u+"！");
}

function doRegister(e){
  e.preventDefault();
  var u=document.getElementById("regUser").value.trim();
  var p=document.getElementById("regPass").value;
  var p2=document.getElementById("regPass2").value;
  if(u.length<3||u.length>12){toast("用户名3-12位");return}
  if(p.length<6){toast("密码6位以上");return}
  if(p!==p2){toast("两次密码不一致");return}
  if(users[u]){toast("用户名已存在");return}
  users[u]={password:hash(p)};
  saveUsers();
  currentUser={username:u};
  pets=[];
  saveCurrent();
  saveData();
  updateUI();
  toast("注册成功，欢迎 "+u+"！");
}

function logout(){
  saveData();
  currentUser=null;
  pets=[];
  saveCurrent();
  updateUI();
  toast("已退出");
}

function showAdopt(){document.getElementById("adoptPanel").classList.add("active")}
function hideAdopt(){document.getElementById("adoptPanel").classList.remove("active")}
function showFeed(id){feedId=id;document.getElementById("feedPanel").classList.add("active")}
function hideFeed(){document.getElementById("feedPanel").classList.remove("active");feedId=null;}

function hatch(type){
  hideAdopt();
  var pet={id:Date.now().toString(36)+Math.random().toString(36).substr(2,5),type:type,name:N[type],level:1,exp:0,hunger:80,happy:80,energy:100,sleeping:false};
  pets.push(pet);
  saveData();
  render();
  toast("恭喜获得 "+N[type]+"！");
}

function getPet(id){
  for(var i=0;i<pets.length;i++){if(pets[i].id===id)return pets[i]}
  return null;
}

function feed(food){
  if(!feedId)return;
  var p=getPet(feedId);
  if(!p){hideFeed();return}
  p.hunger=Math.min(100,p.hunger+(E[food]||10));
  p.happy=Math.min(100,p.happy+3);
  p.exp+=10;
  saveData();
  render();
  hideFeed();
  toast(p.name+" 吃了食物！");
}

function play(id){
  var p=getPet(id);
  if(!p)return;
  if(p.sleeping){toast(p.name+" 在睡觉...");return}
  if(p.energy<20){toast(p.name+" 太累了！");return}
  p.energy=Math.max(0,p.energy-10);
  p.happy=Math.min(100,p.happy+15);
  p.hunger=Math.max(0,p.hunger-5);
  p.exp+=15;
  saveData();
  render();
  toast(p.name+" 玩得很开心！");
}

function sleep(id){
  var p=getPet(id);
  if(!p)return;
  p.sleeping=!p.sleeping;
  if(p.sleeping){p.energy=100;toast(p.name+" 开始睡觉...")}else{toast(p.name+" 睡醒啦！")}
  saveData();
  render();
}

function getStatus(p){
  if(p.sleeping)return"💤 睡觉中...";
  if(p.hunger<30)return"😫 肚子饿了";
  if(p.energy<30)return"😴 好困";
  if(p.happy<30)return"😢 不开心";
  return"😊 开心";
}

function render(){
  document.getElementById("count").textContent=pets.length;
  var c=document.getElementById("petsContainer");
  if(pets.length===0){c.innerHTML='<div style="text-align:center;color:#fff;padding:40px"><div style="font-size:60px">🐾</div><div>还没有宠物~</div><button onclick="showAdopt()" style="background:linear-gradient(135deg,#ffd700,#ff8c00);border:none;padding:12px 24px;border-radius:20px;margin-top:15px;cursor:pointer">领养宠物</button></div>';return}
  var html="";
  for(var i=0;i<pets.length;i++){
    var p=pets[i];
    var avatarImg='assets/'+(PET_AVATARS[p.type]||p.type)+'-3d.png';
    var videoImg='assets/'+(PET_AVATARS[p.type]||p.type)+'-fly.mp4';
    var hasVideo=true;
    html+='<div class="card"><div class="card-top"><div class="name">'+p.name+'</div><div class="level">Lv.'+p.level+'</div></div>';
    if(hasVideo){
      html+='<video src="'+videoImg+'" class="pet-avatar-img" autoplay loop muted playsinline onerror="this.style.display=\'none\';document.querySelector(\'#img-'+p.id+'\').style.display=\'block\'" style="display:none"></video>';
      html+='<img id="img-'+p.id+'" src="'+avatarImg+'" class="pet-avatar-img" alt="'+p.name+'" style="display:block" />';
    }else{
    html+='<div class="stats"><div class="stat">🍖'+p.hunger+'</div><div class="stat">😊'+p.happy+'</div><div class="stat">⚡'+p.energy+'</div></div>';
    html+='<div style="text-align:center;color:rgba(255,255,255,0.8);margin:10px 0">'+getStatus(p)+'</div>';
    html+='<div class="actions">';
    html+='<button class="btn feed" onclick="showFeed(\''+p.id+'\')">🍖</button>';
    html+='<button class="btn play" onclick="play(\''+p.id+'\')">🎮</button>';
    html+='<button class="btn sleep" onclick="sleep(\''+p.id+'\')">'+(p.sleeping?"☀️":"😴")+'</button>';
    html+='</div></div>';
  }
  c.innerHTML=html;
}

init();
</script>
</body>
</html>
